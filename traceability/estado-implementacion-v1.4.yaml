# Estado de implementacion en el producto de la baseline V1.4 de PROC-REP.
#
# Vive FUERA de business/: no forma parte de la copia funcional que se exporta a
# rt-rma-mvp (DC02), de modo que actualizarlo no exige resincronizar el producto.
# Las decisiones, reglas y pendientes siguen en
# business/decisions/decision-log-v1.4.yaml; lo valida
# scripts/validate-decisions.ts junto con ese registro.
#
#   decisions       una entrada por decision del registro. status: IMPLEMENTADO,
#                   PARCIAL, NO_IMPLEMENTADO, CONTRARIO (el codigo hace lo
#                   opuesto) o NO_APLICA (decision de plan o de gobierno).
#                   IMPLEMENTADO, PARCIAL y CONTRARIO llevan evidencia. Las rutas
#                   de evidencia son relativas a app/backend/app salvo que digan
#                   otra cosa.
#   uat_items       commits de rt-rma-mvp que implementaron cada incorporacion de
#                   UAT: prueban la implementacion, no la aprobacion. Las fechas
#                   de los commits son locales (-03:00).
#   formal_uat_acceptance  aceptacion UAT formal en el producto. CONFIRMADO en las
#                   incorporaciones de UAT del registro no equivale a ella.
#
# product.evaluated_commit es el codigo contra el que se evaluaron las
# decisiones; una entrada que se evaluo despues lo dice en su evidencia.

