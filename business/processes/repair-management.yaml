# Gestion de Ordenes de Reparacion - V1.1 (draft).
# Segunda version funcional del proceso, incorporando lo validado en la
# segunda reunion funcional: los 4 origenes de la Orden de Reparacion,
# el estado EN_REVISION para reparaciones aun no diagnosticadas, reserva
# de insumos, asignacion tecnica flexible (EXCLUSIVA/ABIERTA), reintento
# de control tecnico, calculo del puntaje de la reparacion y el primer
# camino hacia el resultado SIN_REPARACION (distinto de CANCELADA) cuando
# la revision tecnica no logra determinar la reparacion requerida.
# Deliberadamente sigue sin definir: flujo completo de tercerizacion,
# scrap, devolucion de repuestos, compras/reposicion de inventario,
# distribucion de puntos entre multiples tecnicos, presupuesto/aprobacion
# del cliente, modelo definitivo de reproceso y reglas de CANCELADA.
# Ver docs/discovery/README.md (seccion V1.1 y pendientes).

process:
  id: PROC-REP
  name: Gestion de Ordenes de Reparacion
  version: "1.1"
  status: draft

nodes:

  - id: EVT-REP-001
    type: event
    name: Surge necesidad de reparacion
    description: >
      Evento que inicia el proceso cuando un equipo requiere una reparacion.

  - id: PROC-REP-010
    type: decision
    name: Cual es el origen de la Orden de Reparacion
    description: >
      La Orden de Reparacion admite cuatro origenes: CLIENTE_EXTERNO
      (cliente externo trae un equipo propio), RT_INTERNO (equipo de
      Rosario Tecno gestionado en la aplicacion de Gestion RT),
      RT_GARANTIA_VENTA (ingreso derivado de una garantia por venta de
      Rosario Tecno) y RMA_GARANTIA_REPARACION (el cliente vuelve porque
      falla una reparacion RMA anterior).

  - id: PROC-REP-020
    type: activity
    name: Recibir referencia y contexto del equipo RT
    actor: ACT-SYSTEM
    description: >
      Origen RT_INTERNO. El equipo pertenece a Rosario Tecno y su
      informacion debe provenir de la aplicacion de Gestion RT. Ademas
      del equipo deben poder identificarse conceptualmente el tipo de
      ingreso del equipo en RT (por ejemplo Proveedor, Toma u otros tipos
      existentes en Gestion RT) y si el equipo tuvo una reparacion
      tercerizada previamente. No se crea todavia una rama de flujo por
      tercerizacion: sigue pendiente de definicion funcional.
    outputs:
      - Equipo RT identificado
      - Tipo de ingreso RT identificado
      - Historial de tercerizacion identificado

  - id: PROC-REP-025
    type: activity
    name: Recibir referencia de garantia de venta RT
    actor: ACT-SYSTEM
    description: >
      Origen RT_GARANTIA_VENTA. La garantia comercial se gestiona y valida
      en la aplicacion de Gestion RT; la aplicacion RMA no decide si la
      garantia comercial corresponde. RMA recibe desde Gestion RT la
      solicitud de reparacion y la referencia al documento que origino la
      garantia. La resolucion de cambio directo sigue siendo
      responsabilidad de Gestion RT; si la resolucion requiere reparacion,
      ingresa al flujo RMA.
    outputs:
      - Cliente identificado
      - Equipo identificado
      - Documento de venta origen identificado
      - Referencia de garantia RT identificada

  - id: PROC-REP-030
    type: activity
    name: Registrar cliente y equipo
    actor: ACT-RECEP
    description: >
      Origen CLIENTE_EXTERNO. Se registran los datos necesarios del
      cliente externo y del equipo recibido para reparacion. El cliente
      externo puede clasificarse conceptualmente como Minorista o
      Mayorista, sin crear una entidad de cliente separada: existe una
      sola entidad conceptual Cliente.
    outputs:
      - Cliente identificado
      - Equipo identificado

  - id: PROC-REP-035
    type: activity
    name: Identificar reparacion original en garantia
    actor: ACT-RECEP
    description: >
      Origen RMA_GARANTIA_REPARACION. Representa a un cliente que vuelve
      porque falla una reparacion realizada anteriormente por RMA. Queda
      relacionada la nueva Orden de Reparacion con la Orden de Reparacion
      que origino la garantia. No se define todavia como se registra
      tecnicamente un reproceso: el modelo definitivo queda pendiente.
    outputs:
      - Cliente identificado
      - Equipo identificado
      - Orden de Reparacion origen identificada

  - id: PROC-REP-040
    type: activity
    name: Crear Orden de Reparacion
    actor: ACT-RECEP
    description: >
      Se crea la unidad transaccional central del proceso, cualquiera sea
      su origen. Las cuatro ramas de origen convergen en este nodo. La
      orden nace en estado REQUERIMIENTO.
    outputs:
      - Orden de Reparacion
      - Estado REQUERIMIENTO

  - id: PROC-REP-045
    type: decision
    name: Se conoce la reparacion requerida
    description: >
      Distingue si, al momento del ingreso, ya se sabe que reparacion
      necesita el equipo.

  - id: PROC-REP-050
    type: decision
    name: Requiere comprobante de recepcion
    description: >
      Las ordenes que requieren comprobante de recepcion son
      CLIENTE_EXTERNO, RT_GARANTIA_VENTA y RMA_GARANTIA_REPARACION.
      RT_INTERNO no lo requiere. Se evalua tanto si la reparacion ya se
      conoce como si la Orden esta EN_REVISION: el comprobante es
      independiente de si la reparacion ya fue diagnosticada.

  - id: PROC-REP-055
    type: activity
    name: Marcar Orden en revision
    actor: ACT-SYSTEM
    description: >
      La reparacion requerida todavia no se conoce. La Orden pasa a
      EN_REVISION con tipo de reparacion sin definir (no usar REVISION
      como tipo de reparacion).
    outputs:
      - Estado EN_REVISION

  - id: PROC-REP-060
    type: activity
    name: Generar comprobante de recepcion
    actor: ACT-SYSTEM
    description: >
      Se genera el documento que acredita que el cliente dejo el equipo
      para ser reparado, para ordenes cuyo origen lo requiere
      (CLIENTE_EXTERNO, RT_GARANTIA_VENTA, RMA_GARANTIA_REPARACION).
      Si la reparacion ya se conoce, el comprobante muestra la Orden, el
      cliente, el equipo y la reparacion requerida. Si la Orden esta
      EN_REVISION, el comprobante muestra la Orden, el cliente y el
      equipo, e indica conceptualmente "reparacion pendiente de
      diagnostico", sin inventar un tipo de reparacion.
    outputs:
      - Comprobante de recepcion

  - id: PROC-REP-065
    type: activity
    name: Realizar revision tecnica
    actor: ACT-TECH
    description: >
      Para una Orden EN_REVISION, el tecnico revisa/diagnostica el equipo
      y registra el resultado de la revision.
    outputs:
      - Resultado de revision tecnica

  - id: PROC-REP-068
    type: decision
    name: Se pudo definir la reparacion requerida
    description: >
      Distingue si, luego de la revision tecnica, se pudo determinar que
      reparacion necesita el equipo.

  - id: PROC-REP-069
    type: activity
    name: Registrar finalizacion sin reparacion
    actor: ACT-RECEP
    description: >
      La revision tecnica no permitio determinar que reparacion necesita
      el equipo. La Orden fue procesada correctamente pero concluye sin
      que se haya realizado una reparacion: resultado SIN_REPARACION.
      SIN_REPARACION no equivale a CANCELADA (una Orden cancelada fue
      interrumpida; una Orden SIN_REPARACION fue procesada hasta su fin
      sin necesitar o poder realizarse una reparacion). El motivo es
      obligatorio; ejemplos conceptuales: no se pudo determinar la falla,
      equipo no reparable, reparacion no disponible, otro. No se define
      todavia un catalogo rigido de motivos.
    outputs:
      - Resultado SIN_REPARACION
      - Motivo (obligatorio)
      - Observaciones de diagnostico/revision
      - Usuario que registra la decision
      - Fecha
    rules:
      - BR-REP-010

  - id: PROC-REP-070
    type: activity
    name: Definir requerimiento de reparacion
    actor: ACT-RECEP
    description: >
      Se registra que reparacion se necesita realizar y, opcionalmente,
      restricciones como marca de repuesto o tecnico requerido.
    inputs:
      - Orden de Reparacion
    outputs:
      - Reparacion requerida
    rules:
      - BR-REP-001

  - id: PROC-REP-075
    type: activity
    name: Definir requerimiento luego de revision
    actor: ACT-RECEP
    description: >
      Recepcion utiliza el resultado de la revision tecnica (PROC-REP-065)
      para definir finalmente la reparacion requerida de una Orden que
      estaba EN_REVISION.
    inputs:
      - Resultado de revision tecnica
    outputs:
      - Reparacion requerida
    rules:
      - BR-REP-001

  - id: PROC-REP-080
    type: activity
    name: Validar factibilidad
    actor: ACT-SYSTEM
    description: >
      Se valida que exista la informacion y los recursos necesarios para
      habilitar la orden. Requiere que la reparacion requerida ya este
      definida (una Orden EN_REVISION no puede validarse hasta que se
      defina que reparacion necesita).
    rules:
      - BR-REP-001
      - BR-REP-002

  - id: PROC-REP-090
    type: decision
    name: Estan disponibles los recursos necesarios

  - id: PROC-REP-100
    type: activity
    name: Registrar advertencia de faltante
    actor: ACT-SYSTEM
    description: >
      El sistema informa los recursos o condiciones que impiden
      habilitar normalmente la orden.

  - id: PROC-REP-110
    type: decision
    name: Usuario autorizado fuerza la orden

  - id: PROC-REP-120
    type: activity
    name: Orden pendiente por recursos
    actor: ACT-SYSTEM
    description: >
      La orden permanece en PENDIENTE_RECURSOS hasta que puedan volver a
      validarse las condiciones necesarias.

  - id: PROC-REP-130
    type: activity
    name: Registrar override
    actor: ACT-COORD
    description: >
      Un usuario autorizado decide continuar a pesar de una validacion
      fallida y debe registrar el motivo.
    outputs:
      - Usuario responsable
      - Fecha
      - Motivo
      - Validacion ignorada
    rules:
      - BR-REP-003

  - id: PROC-REP-140
    type: activity
    name: Habilitar Orden de Reparacion
    actor: ACT-SYSTEM
    description: >
      La orden pasa a HABILITADA y queda en condiciones de ingresar al
      circuito operativo.

  - id: PROC-REP-150
    type: activity
    name: Definir prioridad
    actor: ACT-COORD
    description: >
      El coordinador establece inicialmente la prioridad de ejecucion
      de la orden. El catalogo definitivo de prioridades queda pendiente.

  - id: PROC-REP-170
    type: activity
    name: Ingresar orden a cola de trabajo
    actor: ACT-SYSTEM
    description: >
      La orden pasa a EN_COLA, disponible para que cualquier tecnico
      pueda tomarla. El coordinador no asigna obligatoriamente el
      tecnico.

  - id: PROC-REP-180
    type: activity
    name: Tomar Orden de Reparacion
    actor: ACT-TECH
    description: >
      El tecnico se autoasigna la Orden cuando comienza a trabajar sobre
      ella; la orden pasa a EN_REPARACION. Debe quedar registrado el
      historial de tecnicos que participaron: una Orden puede ser
      iniciada por un tecnico y finalizada por otro, sin sobrescribir
      conceptualmente al tecnico anterior. La Orden queda en modo
      EXCLUSIVA (otro tecnico no deberia poder tomarla, salvo override
      justificado con usuario, fecha y motivo) o en modo ABIERTA (otro
      tecnico puede continuarla); la estructura tecnica de este modo
      queda pendiente de definicion.
    rules:
      - BR-REP-007

  - id: PROC-REP-185
    type: activity
    name: Reservar insumos previstos
    actor: ACT-SYSTEM
    description: >
      Al tomar la Orden se reservan conceptualmente los insumos que
      deberian utilizarse segun la reparacion requerida, antes de
      ejecutar la reparacion. No se reservan insumos mientras la Orden
      esta EN_REVISION (por construccion del flujo, a esta altura la
      reparacion ya esta definida).
    rules:
      - BR-REP-006

  - id: PROC-REP-190
    type: activity
    name: Ejecutar reparacion
    actor: ACT-TECH

  - id: PROC-REP-200
    type: activity
    name: Registrar ejecucion real
    actor: ACT-TECH
    description: >
      El tecnico confirma o modifica los trabajos efectivamente
      realizados, repuestos utilizados, cantidades, observaciones y
      eventuales desperdicios.
    outputs:
      - Reparaciones realizadas
      - Repuestos utilizados
      - Cantidades utilizadas
      - Observaciones
    rules:
      - BR-REP-004

  - id: PROC-REP-210
    type: activity
    name: Generar movimientos de inventario
    actor: ACT-SYSTEM
    description: >
      A partir de la ejecucion registrada, los insumos reservados
      (PROC-REP-185) se consumen segun lo efectivamente utilizado y se
      liberan las reservas no utilizadas; se registran desperdicios
      cuando corresponda. El inventario asociado a la orden distingue
      conceptualmente RESERVADO, CONSUMIDO y LIBERADO.
    rules:
      - BR-REP-005

  - id: PROC-REP-220
    type: activity
    name: Realizar control tecnico
    actor: ACT-RECEP
    description: >
      Recepcion realiza la validacion final del funcionamiento de la
      reparacion antes de marcarla como lista.
    rules:
      - BR-REP-008

  - id: PROC-REP-230
    type: decision
    name: Resultado tecnico correcto

  - id: PROC-REP-235
    type: activity
    name: Registrar control rechazado
    actor: ACT-RECEP
    description: >
      Si el control tecnico falla, se registra el rechazo y la Orden
      vuelve a EN_COLA para que un tecnico (el mismo u otro) pueda
      retomarla.
    outputs:
      - Fecha
      - Usuario
      - Observacion
      - Resultado control
    rules:
      - BR-REP-008

  - id: PROC-REP-245
    type: activity
    name: Calcular puntaje de la reparacion
    actor: ACT-SYSTEM
    description: >
      Cada reparacion realizada tiene una ponderacion configurable. Una
      vez que Recepcion aprueba el control tecnico, el sistema calcula el
      puntaje total correspondiente a la reparacion. Todavia no esta
      definida la distribucion o acreditacion de ese puntaje entre los
      distintos tecnicos que participaron: no debe asumirse que se
      asigna automaticamente a un unico tecnico.
    outputs:
      - Puntaje de la reparacion
    rules:
      - BR-REP-009

  - id: PROC-REP-240
    type: activity
    name: Marcar reparacion lista
    actor: ACT-SYSTEM
    description: >
      La orden pasa a REPARACION_LISTA.

  - id: PROC-REP-250
    type: decision
    name: Requiere entrega a cliente
    description: >
      Se alcanza tanto cuando la reparacion quedo lista (PROC-REP-240)
      como cuando la Orden finalizo SIN_REPARACION (PROC-REP-069). Las
      ordenes que requieren entrega/documentacion al cliente son
      CLIENTE_EXTERNO, RT_GARANTIA_VENTA y RMA_GARANTIA_REPARACION.
      RT_INTERNO continua hacia informar el resultado al sistema RT.

  - id: PROC-REP-260
    type: activity
    name: Notificar cliente
    actor: ACT-RECEP
    description: >
      El sistema asiste a Recepcion preparando el mensaje de WhatsApp
      para avisar que la reparacion esta lista, o que la Orden concluyo
      SIN_REPARACION segun corresponda; Recepcion confirma y envia. Por
      ahora no se automatiza completamente el envio por WhatsApp; a
      futuro podra integrarse con WhatsApp, chatbot o portal web.

  - id: PROC-REP-280
    type: activity
    name: Generar comprobante final
    actor: ACT-SYSTEM
    description: >
      Se genera el documento final que informa el trabajo efectivamente
      realizado. Si la Orden tuvo una reparacion, el comprobante incluye
      ademas las condiciones y vencimiento de la garantia de reparacion.
      Si el resultado de la Orden es SIN_REPARACION, no se genera
      garantia de reparacion.
    outputs:
      - Comprobante final
      - Garantia de reparacion (unicamente si hubo reparacion)

  - id: PROC-REP-270
    type: activity
    name: Entregar equipo
    actor: ACT-ADMIN
    description: >
      Se entrega el equipo al cliente; la orden pasa a ENTREGADA.

  - id: PROC-REP-290
    type: activity
    name: Informar resultado al sistema RT
    actor: ACT-SYSTEM
    description: >
      Para equipos de Rosario Tecno, el resultado de la Orden (incluida
      la reparacion realizada o, si corresponde, SIN_REPARACION) debera
      poder informarse a futuro al sistema que gestiona stock y ventas.
      El estado terminal definitivo para RT_INTERNO queda pendiente de
      definicion.

  - id: EVT-REP-999
    type: end
    name: Fin del flujo de Orden de Reparacion


