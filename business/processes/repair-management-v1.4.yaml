# Gestion de Ordenes de Reparacion - V1.4 (draft).
#
# V1.4 EVOLUCIONA V1.3 (business/processes/repair-management-v1.3.yaml, que
# permanece intacta junto con V1.2) en FEAT-REP-001, FEAT-REP-002 y
# FEAT-REP-009, flujo de CLIENTE_EXTERNO (HP-REP-001), segun decisiones
# confirmadas con Recepcion.
#
# FEAT-REP-001 (captura de informacion y creacion de la Orden) termina en
# PROC-REP-032:
#   PROC-REP-010 -> 030 -> 040 -> 032 -> 045
#   - PROC-REP-030 identifica/crea Cliente y Equipo (busqueda por DNI/IMEI,
#     consulta externa opcional por DNI, carga manual alternativa).
#   - PROC-REP-040 (compartido) crea la Orden (REQUERIMIENTO, cero Detalles);
#     sus salidas se bifurcan por origen igual que PROC-REP-010.
#   - PROC-REP-032 (NUEVO) registra diagnostico inicial, observaciones,
#     checklist y fotografias sobre la Orden ya creada; se puede guardar y
#     retomar; al intentar avanzar advierte (sin bloquear) si faltan
#     fotografias u observaciones (BR-REP-025).
#
# FEAT-REP-002 (diagnostico y gestion de Detalles) pasa a ser responsable de
# la definicion de Detalles, de la DECISION DEL CLIENTE POR DETALLE y del
# comprobante de recepcion. Dos nodos nuevos, reutilizados desde cuatro
# puntos (una sola capacidad, sin duplicar logica):
#   PROC-REP-046 (activity) registra la decision por Detalle y definicion
#   vigente; PROC-REP-047 (decision) enruta el resultado.
#   Puntos de entrada, solo CLIENTE_EXTERNO (los demas origenes conservan
#   su arista anterior, condicion "Origen distinto de CLIENTE_EXTERNO"):
#     PROC-REP-070 (Detalles conocidos), PROC-REP-075 (Detalles hallados en
#     la revision) y PROC-REP-127 (Detalle redefinido), mas PROC-REP-129 y
#     EVT-REP-003. [Iteracion 10] Una Orden sin Detalles (PROC-REP-055) ya NO
#     consulta al cliente por Detalle: PROC-REP-056 solo registra si continua
#     con la revision tecnica.
#   Salidas de PROC-REP-047 (iteracion 10): exactamente TRES decisiones
#   comerciales: acepta trabajos -> PROC-REP-211; rechaza algunos Detalles ->
#   PROC-REP-300; rechaza todos los trabajos -> PROC-REP-305. El comprobante, el
#   hito de habilitacion y la factibilidad pendiente los resuelve el sistema en
#   PROC-REP-211. La decision (autorizacion del cliente) es una
#   dimension propia: no es el estado operativo del Detalle ni el estado
#   agregado de la Orden, que sigue derivandose con el resolver
#   (PROC-REP-211, BR-REP-012).
#
# FEAT-REP-009 (cancelacion) ejecuta los desistimientos reutilizando
# PROC-REP-300/305 (ahora tambien alcanzables desde PROC-REP-047),
# PROC-REP-306 (cancelacion temprana de Orden sin Detalles) y PROC-REP-211.
# Como la Orden aun no fue habilitada en esos puntos, PROC-REP-211 gana dos
# salidas "Orden sin habilitar" (hacia 050 u 080) en vez de volver a la
# cola (PROC-REP-170). BR-REP-014 y PROC-REP-069 no cambian.
#
# Cuarta iteracion de V1.4 (autorizacion, altas por tecnico, resolver y
# devolucion):
#   - Un Detalle PENDIENTE_AUTORIZACION (condicion derivada de la autorizacion
#     del cliente, solo CLIENTE_EXTERNO) no se ejecuta, pero NO bloquea a los
#     demas Detalles. No hay autorizacion general de la Orden.
#   - PROC-REP-128 (NUEVO, ACT-TECH): el tecnico agrega un Detalle durante la
#     ejecucion (origen del diagnostico REVISION_TECNICA); la Ejecucion vigente
#     no se interrumpe. PROC-REP-129 (NUEVO) es la espera de la autorizacion del
#     cliente, analoga a PROC-REP-120 (recursos) y PROC-REP-125 (revision).
#   - Resolver (BR-REP-012) y enrutamiento se separan (BR-REP-034): el resolver
#     devuelve una situacion principal mas el conjunto de bloqueos, y las
#     aristas de PROC-REP-211 eligen la estacion siguiente segun la situacion
#     Y los hitos (comprobante emitido, Orden habilitada, toma activa). Se
#     precisan las condiciones de las salidas "sin habilitar" y se agregan
#     211 -> 129, 211 -> 190 y 090 -> 211 [Orden ya habilitada].
#   - Custodia (BR-REP-033): el comprobante de recepcion es lo que se
#     intercambia por el equipo; solo con comprobante entregado hay devolucion.
#     Toda cancelacion total con equipo recibido pasa por PROC-REP-270 y la
#     Orden queda CANCELADA (211 (d) se bifurca por custodia).
#
# Dependencia con FEAT-REP-002 (sin rediseñar su validacion tecnica): las
# "reparaciones diagnosticadas" seleccionadas por Recepcion en PROC-REP-032
# NO crean Detalles en FEAT-REP-001 (ver BR-REP-026).
# Todo lo demas es identico a V1.3 (la prosa que menciona V1.3 describe
# semantica heredada).
#
# Texto heredado de V1.3:
#
# Convive explicitamente con business/processes/repair-management.yaml
# (PROC-REP V1.2, approved), que permanece intacta como baseline historica
# y NO se modifica ni se sobrescribe. V1.3 es un archivo independiente,
# validable y generable por separado (ver package.json: scripts
# *:v1.3), hasta que eventualmente reemplace a V1.2 como baseline aprobada.
#
# Cambio funcional central respecto de V1.2: la Orden de Reparacion deja de
# asumir una unica reparacion. Pasa a tener 1..N Detalles de Reparacion
# (unidad tecnica de trabajo), cada uno con su propio Tipo de Reparacion,
# precio snapshot, Ejecuciones e Insumos:
#
#   OrdenReparacion (unidad de gestion)
#     -> DetalleReparacion (unidad tecnica de trabajo, 1..N por Orden)
#         -> Ejecucion (1..N por Detalle, como maximo una activa por Orden)
#         -> Insumo utilizado -> MovimientoInventario
#
# El tecnico toma la Orden completa (igual que V1.2) pero luego trabaja
# Detalle por Detalle. Reemplaza el modo EXCLUSIVA/ABIERTA de V1.2 (ver
# BR-REP-007 V1.3) por una regla mas simple y realista: como maximo una
# Ejecucion activa por Orden en todo momento (la Orden representa un unico
# equipo fisico). La toma/participacion de la Orden en si es un concepto
# aparte, tambien unico por Orden en simultaneo (BR-REP-018 V1.3): se
# libera explicitamente por decision del tecnico o automaticamente cuando
# ya no queda ningun Detalle trabajable.
#
# El estado tecnico agregado de la Orden (SIN_DETALLES / EN_EJECUCION /
# ABIERTA_TRABAJABLE / REQUIERE_REVISION / PENDIENTE_RECURSOS / COMPLETA /
# TODO_CANCELADO) es siempre DERIVADO del conjunto de sus Detalles
# mediante un resolver de
# reglas centralizado y ordenado por prioridad (documentado en
# docs/discovery/README.md, seccion "PROC-REP V1.3 - Resolver de estado de
# Orden"), nunca una segunda fuente de verdad fijada manualmente por un
# nodo. Los nodos de este YAML narran el flujo que un tecnico/Recepcion
# recorre; las transiciones de estado agregado que resultan de ese
# recorrido se calculan siempre con ese mismo resolver.
#
# Este archivo resulta de tres rondas de revision funcional critica
# (factibilidad por Detalle, toma de Orden con compatibilidad parcial,
# seleccion/ejecucion por Detalle, reserva real al iniciar Ejecucion,
# control y retrabajo por Detalle, cancelacion de Detalle/Orden, modelo
# comercial Subtotal/Ajustes/Saldo). Los 4 bloqueos identificados en la
# segunda ronda (falla de reserva al iniciar Ejecucion, incompatibilidad
# total de estacion sin override, cancelacion con Ejecucion activa,
# alcance de la cascada de cancelacion sobre Detalles COMPLETO) quedaron
# resueltos como definiciones funcionales y estan reflejados en los nodos
# 186, 172, 300/305 y en BR-REP-014.
#
# Commit correctivo posterior sobre este draft (4 correcciones aprobadas,
# sin alterar V1.2 ni Features): (1) PENDIENTE_RECURSOS y REQUIERE_REVISION
# dejan de volver a EN_COLA (PROC-REP-170) directamente: PROC-REP-211 ahora
# las distingue y las dirige a sus propios circuitos de espera/revalidacion
# (PROC-REP-120 revalida directo via PROC-REP-080; PROC-REP-125 revalida
# via los nuevos PROC-REP-126/127, porque PROC-REP-080 no puede resolver
# por si solo la condicion REQUIERE_DEFINICION de un Detalle), sin
# mezclarse entre si ni con el estado de workflow EN_REVISION; (2)
# SIN_REPARACION se redefine sin "Diagnostico cobrable" (concepto que no
# existe en V1.3):
# implica Subtotal = 0 (PROC-REP-069, PROC-REP-280, BR-REP-010); (3) se
# formaliza la toma/participacion activa de la Orden como concepto propio,
# distinto de la Ejecucion activa: como maximo una toma activa por Orden,
# con decision explicita de continuar o liberar (PROC-REP-180, nuevos
# PROC-REP-212/213, nueva BR-REP-018); (4) el comprobante final
# (PROC-REP-280) se genera despues de completar el cobro (PROC-REP-265), no
# antes, para reflejar siempre el saldo definitivo al momento de la
# entrega.
#
# Deliberadamente sigue sin definir en V1.3 (igual que en V1.2, mas los
# temas nuevos que este cambio introdujo): flujo completo de
# tercerizacion, scrap, devolucion a proveedor, modelo definitivo de
# reproceso RMA (resuelto: se vincula a Orden origen Y a Detalle origen,
# BR-REP-019; queda pendiente el modelo tecnico y las reglas de garantia
# vencida), distribucion de puntaje entre multiples tecnicos, catalogo definitivo de
# prioridades, reglas de CANCELADA (quien/cuando/motivo), estado terminal
# definitivo de RT_INTERNO, presupuestacion, consecuencias comerciales de
# la cancelacion (reembolsos), costo de reparacion (mano de obra + costo
# real de insumos vs. precio), impuestos/recargos/descuentos futuros sobre
# la Base Comercial, y si la cortesia puede ser parcial o siempre total.
# Ver docs/discovery/README.md (seccion V1.3) para el detalle completo de
# pendientes.
#
# Las 7 Features de V1.2 (business/features/repair-management-features.yaml)
# permanecen intactas como baseline historica. V1.3 ahora tiene su propia
# descomposicion funcional, independiente y validable por separado:
# business/features/repair-management-features-v1.3.yaml (9 Features,
# draft). Esta actualizacion es solo de Features/documentacion: no cambia
# ningun nodo, edge ni Business Rule de este archivo.
#
# Decima iteracion de V1.4 (simplificacion de la decision del cliente):
#   - Si todavia no existen Detalles (PROC-REP-045 = No) la Orden queda
#     EN_REVISION (055), se registra la recepcion (050/060) y se espera la
#     revision y el diagnostico de RT (065/068/075); recien con los Detalles
#     definidos Recepcion consulta al cliente por Detalle (046/047). Nodo nuevo
#     PROC-REP-056: solo registra si el cliente continua con la revision (o
#     desiste: PROC-REP-306). 055 ya no lleva a 046 y 046/047 nunca se invocan
#     con cantidad_detalles = 0 (corrige el recorrido de AUD-V14-002).
#   - PROC-REP-047 queda con tres decisiones: acepta trabajos (-> 211), rechaza
#     algunos Detalles (-> 300) y rechaza todos los trabajos (-> 305). Se
#     retiran "Acepta, antes del comprobante", "Acepta, requiere factibilidad",
#     "Desiste sin Detalles" y "Sin respuesta del cliente": las condiciones
#     internas las enruta PROC-REP-211 (que ya elegia 050 u 080) y la solicitud
#     sin respuesta pasa a ser una arista de PROC-REP-046 (046 -> 211), sin
#     decision ficticia. PROC-REP-211 -> 080 tambien aplica a una Orden ya
#     habilitada (autorizacion parcial sin omitir factibilidad, AUD-V14-003).

process:
  id: PROC-REP
  name: Gestion de Ordenes de Reparacion
  version: "1.4"
  status: draft

nodes:

  - id: EVT-REP-001
    type: event
    name: Surge necesidad de reparacion
    description: >
      Evento que inicia el proceso cuando un equipo requiere una reparacion.

  - id: EVT-REP-002
    type: event
    name: Una Orden de Reparacion finalizada requiere garantia
    description: >
      Evento de inicio propio de la garantia de reparacion RMA (Happy Path
      HP-REP-003). A diferencia de EVT-REP-001 (surge una necesidad de
      reparacion NUEVA), aqui el disparador es que una reparacion ya realizada
      por RMA -en una Orden ya finalizada- presenta una falla cubierta por
      garantia, y Recepcion inicia la garantia sobre esa Orden ("Iniciar
      garantia RMA", una unica accion a nivel Orden) seleccionando uno o mas
      Detalles origen. No es un alta de cliente ni de equipo: ambos ya existen
      en la Orden origen. Converge directamente en PROC-REP-035, sin pasar por
      PROC-REP-010 (el origen ya es conocido). La Orden origen se considera
      finalizada cuando llego a ENTREGADA; el modelo no define un estado
      CERRADA aparte y esta iteracion no lo crea.

  - id: PROC-REP-010
    type: decision
    name: Cual es el origen de la Orden de Reparacion
    description: >
      La Orden de Reparacion admite cuatro origenes: CLIENTE_EXTERNO
      (cliente externo trae un equipo propio), RT_INTERNO (equipo de
      Rosario Tecno gestionado en la aplicacion de Gestion RT),
      RT_GARANTIA_VENTA (ingreso derivado de una garantia por venta de
      Rosario Tecno) y RMA_GARANTIA_REPARACION (el cliente vuelve porque
      falla una reparacion RMA anterior). Sin cambios respecto de V1.2. La
      garantia RMA tambien puede iniciarse sin pasar por este nodo, desde
      EVT-REP-002 (una Orden finalizada requiere garantia) hacia
      PROC-REP-035.

  - id: PROC-REP-020
    type: activity
    name: Recibir referencia y contexto del equipo RT
    actor: ACT-SYSTEM
    description: >
      Origen RT_INTERNO. El equipo pertenece a Rosario Tecno y su
      informacion debe provenir de la aplicacion de Gestion RT. Ademas
      del equipo deben poder identificarse conceptualmente el tipo de
      ingreso del equipo en RT (por ejemplo Proveedor, Toma u otros tipos
      existentes en Gestion RT) y si el equipo tuvo una reparacion
      tercerizada previamente. No se crea todavia una rama de flujo por
      tercerizacion: sigue pendiente de definicion funcional. Sin cambios
      respecto de V1.2.
    outputs:
      - Equipo RT identificado
      - Tipo de ingreso RT identificado
      - Historial de tercerizacion identificado

  - id: PROC-REP-025
    type: activity
    name: Recibir referencia de garantia de venta RT
    actor: ACT-SYSTEM
    description: >
      Origen RT_GARANTIA_VENTA. La garantia comercial se gestiona y valida
      en la aplicacion de Gestion RT; la aplicacion RMA no decide si la
      garantia comercial corresponde. RMA recibe desde Gestion RT la
      solicitud de reparacion y la referencia al documento que origino la
      garantia. La resolucion de cambio directo sigue siendo
      responsabilidad de Gestion RT; si la resolucion requiere reparacion,
      ingresa al flujo RMA. Sin cambios respecto de V1.2.
    outputs:
      - Cliente identificado
      - Equipo identificado
      - Documento de venta origen identificado
      - Referencia de garantia RT identificada

  - id: PROC-REP-030
    type: activity
    name: Registrar cliente y equipo
    actor: ACT-RECEP
    description: >
      Origen CLIENTE_EXTERNO. Recepcion identifica o registra al cliente
      externo y al equipo recibido para reparacion. Existe una sola entidad
      conceptual Cliente, clasificable como Minorista o Mayorista, y se
      reutiliza la entidad Equipo existente (no se crean entidades
      duplicadas). CLIENTE: primero se busca un cliente existente por DNI
      y, cuando corresponda, por telefono; si existe se recuperan y
      confirman sus datos, y si no se crea uno nuevo (BR-REP-020). Para un
      cliente nuevo se contempla el autocompletado opcional consultando
      https://www.cuitonline.com/search/ por numero de DNI (scraping, NO API
      de Renaper): los datos recuperados son verificables y editables por
      Recepcion, y si la consulta falla, no encuentra datos o no puede
      utilizarse, se carga manualmente (BR-REP-021). EQUIPO: se busca por
      IMEI como criterio principal; si existe se recupera su informacion y
      puede consultarse su historial de ordenes, y si no existe se registra
      uno nuevo con marca, modelo, color y IMEI y/o numero de serie;
      un equipo sin IMEI disponible o legible se identifica por un medio
      alternativo, dejando esa excepcion marcada para validacion
      (BR-REP-022). La integracion con la fuente externa se documenta como
      requerimiento funcional: no se asume que el acceso automatizado este
      autorizado ni garantizado (pendiente tecnico: condiciones de uso,
      privacidad, disponibilidad y confiabilidad de la fuente).
    outputs:
      - Cliente identificado (existente recuperado o nuevo)
      - Equipo identificado (existente recuperado o nuevo)
      - Referencias de cliente y equipo disponibles para crear la Orden
    rules:
      - BR-REP-020
      - BR-REP-021
      - BR-REP-022

  - id: PROC-REP-032
    type: activity
    name: Registrar informacion inicial y condiciones del equipo
    actor: ACT-RECEP
    description: >
      Nodo nuevo en V1.4, propio del ingreso de CLIENTE_EXTERNO y ultimo de
      FEAT-REP-001. Trabaja sobre la Orden YA CREADA en PROC-REP-040
      (REQUERIMIENTO, cero Detalles). Recepcion registra la informacion
      inicial y las condiciones en que se recibe el equipo. (1) DIAGNOSTICO
      INICIAL: texto libre asociado a la OrdenReparacion que describe
      problemas ("no carga", "bateria dura poco", "no tiene imagen"); a
      futuro podra complementarse con diagnosticos estandarizados desde una
      configuracion administrable, sin reemplazar al texto libre; no se crea
      una entidad DiagnosticoInicial independiente. NO es lo mismo que las
      reparaciones diagnosticadas (trabajos como "cambio de bateria" o
      "cambio de pin de carga", que son ReparacionDetail de FEAT-REP-002).
      (2) OBSERVACIONES GENERALES: texto libre en la OrdenReparacion para
      danos existentes, condiciones generales y cualquier dato relevante del
      estado del equipo al recibirlo. (3) CHECKLIST DE RECEPCION: opcional,
      permite registrar verificaciones y distinguir las no realizadas (su
      estructura se define posteriormente). (4) FOTOGRAFIAS: opcionales,
      asociadas a la Orden como evidencia de recepcion con trazabilidad de
      los archivos; pueden tomarse en el momento con la camara del celular
      mediante una aplicacion web movil o seleccionarse desde la
      galeria/archivos (requerimiento funcional de frontend y persistencia,
      sin implementar). Todo es opcional y Recepcion puede GUARDAR
      parcialmente y retomar mas tarde sin perder lo cargado: guardar NO
      avanza el workflow ni crea un estado de negocio nuevo (la Orden sigue en
      REQUERIMIENTO) (BR-REP-023, BR-REP-024). AL INTENTAR AVANZAR hacia
      PROC-REP-045 se evalua la advertencia no bloqueante por fotografias
      y/u observaciones faltantes (BR-REP-025): se indica que falta y
      Recepcion elige volver a completar (permanece en este nodo) o continuar
      igualmente, registrandose la confirmacion; no se advierte por falta de
      checklist ni de diagnostico inicial. Esta advertencia de informacion
      incompleta NO es la decision del cliente sobre los trabajos
      (PROC-REP-046/047, FEAT-REP-002): son dos eventos distintos. Opcionalmente
      Recepcion puede seleccionar cero, uno o varios tipos de reparacion
      diagnosticados (lista desplegable del catalogo TipoReparacion); esa
      seleccion NO crea Detalles aqui, su creacion sigue en FEAT-REP-002
      (PROC-REP-045/070/075), ver BR-REP-026. FEAT-REP-001 termina aqui: no
      define Detalles, no autoriza ni rechaza trabajos, no decide
      desistimientos, no genera el comprobante de recepcion y no ejecuta
      cancelaciones.
    inputs:
      - Orden de Reparacion creada (REQUERIMIENTO, cero Detalles)
      - Cliente identificado
      - Equipo identificado
    outputs:
      - Diagnostico inicial (texto libre, guardable y recuperable)
      - Observaciones generales (texto libre, guardables y recuperables)
      - Checklist de recepcion (opcional)
      - Fotografias de recepcion (opcionales)
      - Reparaciones diagnosticadas por Recepcion (opcional, 0..N tipos; no son Detalles)
      - Confirmacion trazable de la advertencia de evidencias faltantes (cuando corresponda)
    rules:
      - BR-REP-023
      - BR-REP-024
      - BR-REP-025
      - BR-REP-026

  - id: PROC-REP-035
    type: activity
    name: Identificar reparacion original en garantia
    actor: ACT-RECEP
    description: >
      Origen RMA_GARANTIA_REPARACION. Representa a un cliente que vuelve
      porque falla una reparacion realizada anteriormente por RMA. Parte de
      una Orden de Reparacion origen ya finalizada (ENTREGADA), que NO se
      reabre y permanece historicamente inmutable. Se identifica (1) la Orden
      origen y (2) uno o mas Detalles especificos de esa Orden que originan la
      garantia (1..N): una unica Orden de garantia puede nacer de varios
      Detalles de la misma Orden origen; no se crea una Orden de garantia por
      cada Detalle. Cliente y equipo se RECUPERAN de la Orden origen:
      funcionalmente no es un nuevo alta de cliente/equipo (por eso no pasa
      por PROC-REP-030), aunque la nueva Orden pueda copiar/referenciar los
      datos que necesite para su propia consistencia historica. Es el unico
      nodo de identificacion de origen para este Happy Path: se alcanza desde
      EVT-REP-002 (parte de una Orden finalizada) o, como entrada alternativa,
      desde PROC-REP-010 cuando Recepcion identifica la garantia. La
      vinculacion es en ambos niveles: la nueva Orden referencia la Orden
      origen y los Detalles origen identificados, y cada Detalle de garantia
      referenciara uno de esos Detalles origen (BR-REP-019). Toda garantia RMA
      pasa por revision tecnica antes de definir que reparacion se realiza
      (PROC-REP-045 = No -> PROC-REP-055): la referencia a nivel Detalle se
      materializa recien al definir los Detalles luego de esa revision
      (PROC-REP-075), y la Orden nueva nace sin Detalles propios.
    inputs:
      - Orden de Reparacion origen finalizada
    outputs:
      - Cliente identificado (recuperado de la Orden origen)
      - Equipo identificado (recuperado de la Orden origen)
      - Orden de Reparacion origen identificada
      - Detalle(s) origen identificado(s)
    rules:
      - BR-REP-019

  - id: PROC-REP-040
    type: activity
    name: Crear Orden de Reparacion
    actor: ACT-RECEP
    description: >
      Se crea la unidad transaccional central del proceso, cualquiera sea
      su origen. Las cuatro ramas de origen convergen en este nodo. La
      Orden nace en estado REQUERIMIENTO con cero Detalles de Reparacion
      (cantidad_detalles = 0): todavia no implica ninguna reparacion en
      particular. REQUERIMIENTO es un hito de workflow fijado por este
      evento, no algo que decida el resolver tecnico de Detalles (ver
      BR-REP-013): mientras cantidad_detalles = 0, el resolver nunca
      llega a invocarse -PROC-REP-090 y PROC-REP-211 solo son alcanzables
      despues de que exista al menos un Detalle (PROC-REP-070/075)-. Para
      una garantia RMA (RMA_GARANTIA_REPARACION) se crea una NUEVA Orden
      con origen RMA_GARANTIA_REPARACION, condicion comercial NO_COBRABLE
      (BR-REP-016) y referencia a la Orden origen (BR-REP-019); la Orden
      origen no se reabre ni se reutiliza transaccionalmente. V1.4 (flujo
      CLIENTE_EXTERNO): la Orden se crea INMEDIATAMENTE despues de
      identificar Cliente y Equipo (PROC-REP-030), antes de registrar
      diagnostico, observaciones, fotografias o checklist: ninguno de ellos
      es requisito para crear la Orden. Se verifican los datos obligatorios
      de Cliente y Equipo, se asocian a la Orden y se registran el usuario
      responsable y la fecha/hora de creacion. Como este nodo es compartido,
      sus salidas se bifurcan por origen: CLIENTE_EXTERNO continua a
      PROC-REP-032 (informacion inicial; alli vive la advertencia de
      evidencias faltantes) y RT_INTERNO, RT_GARANTIA_VENTA y
      RMA_GARANTIA_REPARACION conservan su recorrido anterior hacia
      PROC-REP-045.
    outputs:
      - Orden de Reparacion
      - Estado REQUERIMIENTO
      - Cliente y Equipo asociados a la Orden
      - Usuario responsable y fecha/hora de creacion
    rules:
      - BR-REP-013
      - BR-REP-019
      - BR-REP-026

  - id: PROC-REP-045
    type: decision
    name: Se conocen los Detalles de reparacion requeridos
    description: >
      Distingue si, al momento del ingreso, ya se sabe que Detalle o Detalles
      de reparacion necesita el equipo (por ejemplo "cambio de bateria" y
      "cambio de pantalla"). Reemplaza conceptualmente a la version singular
      de V1.2 ("se conoce la reparacion requerida"). En una garantia RMA
      (RMA_GARANTIA_REPARACION) la respuesta es siempre No: la revision
      tecnica es obligatoria antes de definir que reparacion se realiza
      (BR-REP-019), aunque los Detalles origen ya esten identificados. V1.4:
      CLIENTE_EXTERNO llega aqui desde PROC-REP-032, ya con la Orden creada y
      la informacion inicial registrada; las reparaciones diagnosticadas por
      Recepcion pueden ser los Detalles que se cargan en PROC-REP-070.
      Con Detalles conocidos, despues de definirlos CLIENTE_EXTERNO registra la
      decision del cliente por Detalle (PROC-REP-046/047) ANTES del comprobante
      de recepcion. Sin Detalles conocidos (marcar la Orden EN_REVISION,
      PROC-REP-055) NO se consulta al cliente por Detalle -no existe ninguno-:
      Recepcion solo registra si continua con la revision tecnica
      (PROC-REP-056), el tecnico define los Detalles (PROC-REP-075) y recien
      entonces se consulta al cliente por ellos.

  - id: PROC-REP-046
    type: activity
    name: Registrar decision del cliente por Detalle
    actor: ACT-RECEP
    description: >
      Nodo nuevo en V1.4 de FEAT-REP-002, propio de CLIENTE_EXTERNO. Es la
      UNICA capacidad de decision del cliente sobre los trabajos y se
      reutiliza desde los puntos del proceso donde YA EXISTEN Detalles, sin
      duplicar logica: despues de definir los Detalles conocidos
      (PROC-REP-070), despues de definir los Detalles hallados en la revision
      (PROC-REP-075), despues de redefinir un Detalle (PROC-REP-127), cuando la
      Orden espera la autorizacion de Detalles pendientes (PROC-REP-129) y
      desde la gestion independiente de Recepcion (EVT-REP-003, por ejemplo por
      un Detalle que un tecnico agrego en PROC-REP-128 o PROC-REP-184).
      Iteracion de simplificacion: NO se invoca mientras no exista ningun
      Detalle. Una Orden EN_REVISION sin Detalles (PROC-REP-055) espera el
      diagnostico de RT y la definicion de los trabajos antes de consultar al
      cliente por Detalle; lo unico que se registra antes es si el cliente
      continua con la revision tecnica (PROC-REP-056, desistimiento propio de
      esa etapa), de modo que nunca se pide autorizacion por reparaciones
      inexistentes ni se invoca el resolver con cantidad_detalles = 0
      (BR-REP-013). Registra, por cada Detalle afectado Y su definicion
      vigente, si el cliente lo AUTORIZA o lo RECHAZA (el cliente no esta
      obligado a aceptar todos), con fecha/hora, usuario responsable, alcance y
      resultado, y contemplando evidencia de consentimiento (el canal -firma,
      WhatsApp, presencial, etc.- queda pendiente de decision de negocio). La
      aceptacion de la revision tecnica NO autoriza reparaciones posteriores:
      los Detalles que se definan luego vuelven a requerir su propia decision.
      Un Detalle nuevo o modificado (nueva definicion vigente) nace
      PENDIENTE_AUTORIZACION (condicion derivada, no un estado operativo),
      requiere decision nueva y no pasa a ejecucion ni a factibilidad sin ella,
      pero NO bloquea a los demas Detalles autorizados de la Orden
      (BR-REP-028); un Detalle que no cambia conserva su autorizacion vigente,
      que no se invalida innecesariamente (BR-REP-028, BR-REP-029). Es el unico
      punto donde Recepcion registra la autorizacion o el desistimiento sobre
      Detalles y lo hace por Detalle, de modo que cada Detalle adicional tiene
      su propia decision, independiente de la del Detalle original. La decision
      es una dimension propia -autorizacion del cliente- distinta del estado
      operativo del Detalle y del estado agregado de la Orden. Salidas:
      "Decision del cliente registrada" -> PROC-REP-047, que enruta unicamente
      el resultado comercial (acepta trabajos, rechaza algunos Detalles,
      rechaza todos los trabajos); "Solicitud sin resolver, Detalles siguen
      pendientes de autorizacion" -> PROC-REP-211: el cliente todavia no
      respondio, NO se registra ninguna decision (no se pasa por PROC-REP-047),
      los Detalles consultados siguen PENDIENTE_AUTORIZACION -ni autorizados ni
      rechazados- y el resolver los mantiene bloqueados individualmente: no se
      inicia ninguna ejecucion sobre ellos, no se bloquea a los demas Detalles
      autorizados y la consulta puede reintentarse (PROC-REP-129, EVT-REP-003,
      BR-REP-037). Requerimiento funcional de UI (sin desarrollar): listar los
      Detalles con tipo de reparacion y estado; mostrar cuales estan
      autorizados, pendientes de decision o rechazados; permitir seleccionar
      individualmente trabajos para desistir y ofrecer "Desistir de todos los
      trabajos pendientes" (opcion de UI, no un estado ni una entidad);
      solicitar motivo y confirmacion; informar que trabajos se mantienen y
      cuales se cancelaran; impedir seleccionar los que no pueden cancelarse
      directamente; conservar el historial de decisiones (BR-REP-030).
      Registrar la decision NO ejecuta cancelaciones: las ejecuta FEAT-REP-009.
      Tambien es el carril de gestion INDEPENDIENTE de Recepcion (evento
      EVT-REP-003): puede resolverse en cualquier momento, sin exigir una
      respuesta inmediata del cliente y sin detener al tecnico; la creacion de
      la solicitud (por ejemplo PROC-REP-128) y su resolucion son actividades
      distintas.
    inputs:
      - Detalle(s) con definicion vigente pendiente de decision
    outputs:
      - Decision por Detalle y definicion vigente (autoriza / rechaza), o solicitud sin resolver
      - Fecha/hora, usuario responsable, alcance y evidencia de consentimiento
    rules:
      - BR-REP-028
      - BR-REP-029
      - BR-REP-030
      - BR-REP-037

  - id: PROC-REP-047
    type: decision
    name: Que decidio el cliente
    description: >
      Nodo de FEAT-REP-002 (V1.4, iteracion de simplificacion). Enruta el
      resultado COMERCIAL registrado en PROC-REP-046 y ofrece exactamente TRES
      alternativas de negocio, las unicas decisiones del cliente sobre los
      trabajos, siempre sobre Detalles que ya existen. (A) ACEPTA_TRABAJOS
      ("Acepta trabajos"): el cliente acepta los trabajos propuestos; se
      registra la autorizacion de cada Detalle sobre su definicion vigente, sin
      generar una nueva definicion y sin ejecutar ninguna reparacion todavia, y
      el proceso continua automaticamente en PROC-REP-211, donde el sistema
      decide el circuito operativo. (B) RECHAZA_ALGUNOS_DETALLES ("Rechaza
      algunos Detalles"): el cliente acepta algunos trabajos y rechaza otros; se
      registra individualmente que Detalles acepta y cuales rechaza,
      PROC-REP-300 cancela unicamente los rechazados (conservando su historial,
      precio snapshot y decision) y los aceptados continuan por PROC-REP-211
      hacia factibilidad cuando corresponde, sin ser bloqueados por el rechazo
      de otros; se conservan el hito historico de habilitacion y la toma activa
      si aplican. (C) RECHAZA_TODOS_LOS_TRABAJOS ("Rechaza todos los trabajos"):
      el cliente rechaza todos los trabajos pendientes; PROC-REP-305 cancela los
      Detalles no terminales segun las reglas de cancelacion existentes (los
      COMPLETO se conservan y no se cancelan Ejecuciones activas: primero deben
      cerrarse, BR-REP-014) y PROC-REP-211 determina el desenlace, incluidos la
      custodia fisica del equipo (BR-REP-033) y el saldo, los anticipos y su
      devolucion (BR-REP-038). Este nodo NO ofrece como elecciones del cliente
      la existencia del comprobante de recepcion, el hito de habilitacion, la
      factibilidad pendiente ni el estado de la Orden: son condiciones INTERNAS
      que el sistema resuelve automaticamente despues de registrar la decision,
      en PROC-REP-211 ("Antes del comprobante de recepcion" -> PROC-REP-050,
      "Comprobante emitido, factibilidad pendiente" -> PROC-REP-080, y el resto
      segun el resolver, BR-REP-012 y BR-REP-034). Tampoco ofrece "Desiste sin
      Detalles" (una Orden sin Detalles nunca llega aqui: su desistimiento es
      propio de PROC-REP-056) ni "Sin respuesta" (no es una decision: si el
      cliente no respondio no se registra nada y la solicitud queda sin
      resolver en PROC-REP-046, arista hacia PROC-REP-211). La decision es por
      Detalle (BR-REP-028): si el cliente responde solo por algunos Detalles, se
      registran las respuestas de esos (A o B) y los demas siguen
      PENDIENTE_AUTORIZACION. Cuando la decision es sobre un Detalle agregado
      durante la ejecucion (PROC-REP-128), autorizar o rechazar NO interrumpe la
      Ejecucion de otro Detalle ni cierra la toma: el Detalle autorizado pasa
      por factibilidad antes de poder iniciarse (BR-REP-034).
    rules:
      - BR-REP-028
      - BR-REP-030

  - id: PROC-REP-050
    type: decision
    name: Requiere comprobante de recepcion
    rules:
      - BR-REP-031
    description: >
      Las ordenes que requieren comprobante de recepcion son
      CLIENTE_EXTERNO, RT_GARANTIA_VENTA y RMA_GARANTIA_REPARACION.
      RT_INTERNO no lo requiere. Se evalua tanto si los Detalles ya se
      conocen como si la Orden esta EN_REVISION: el comprobante es
      independiente de si los Detalles ya fueron diagnosticados. V1.4:
      pertenece funcionalmente a FEAT-REP-002; en CLIENTE_EXTERNO se alcanza
      recien DESPUES de la decision inicial del cliente -con Detalles
      conocidos, la aceptacion de los trabajos (PROC-REP-046/047) enrutada por
      PROC-REP-211 ("Antes del comprobante de recepcion"); sin Detalles, que el
      cliente continue con la revision tecnica (PROC-REP-056)- y no se alcanza
      si el cliente desiste antes de aceptar el ingreso (BR-REP-031). Los demas
      origenes conservan su recorrido anterior.

  - id: PROC-REP-055
    type: activity
    name: Marcar Orden en revision
    actor: ACT-SYSTEM
    description: >
      Todavia no se conoce ningun Detalle de reparacion requerido
      (cantidad_detalles = 0, o el unico Detalle existente carece de Tipo
      de Reparacion asignado). La Orden pasa a EN_REVISION. Igual que
      REQUERIMIENTO (PROC-REP-040), EN_REVISION en este punto del flujo
      es un hito de workflow fijado por este evento explicito -no algo
      que el resolver tecnico "decida" entre REQUERIMIENTO/EN_REVISION-;
      el resolver (BR-REP-012) solo entra en juego una vez que existe al
      menos un Detalle. No usar REVISION como Tipo de Reparacion de
      ningun Detalle.
    outputs:
      - Estado EN_REVISION

  - id: PROC-REP-056
    type: activity
    name: Registrar si el cliente continua con la revision tecnica
    actor: ACT-RECEP
    description: >
      Nodo nuevo en V1.4 (iteracion de simplificacion), propio de
      CLIENTE_EXTERNO y de FEAT-REP-002. Se alcanza desde PROC-REP-055 cuando la
      Orden ya esta EN_REVISION y TODAVIA NO existe ningun Detalle
      (cantidad_detalles = 0). En esta etapa NO se consulta al cliente por
      Detalle: no hay trabajos que autorizar ni rechazar, por lo que
      PROC-REP-046/047 (autorizacion por Detalle) no se invocan ni se invoca el
      resolver (BR-REP-013). Recepcion registra unicamente si el cliente
      continua con la revision tecnica, es decir, si deja el equipo para
      obtener un diagnostico de RT. "Acepta la revision tecnica" sigue a
      PROC-REP-050 (comprobante de recepcion, "reparacion pendiente de
      diagnostico", BR-REP-031) y luego a PROC-REP-065 (revision del tecnico),
      PROC-REP-068 y PROC-REP-075, donde el tecnico define y registra los
      Detalles; recien entonces Recepcion consulta al cliente por esos Detalles
      (PROC-REP-046/047). Aceptar la revision NO autoriza reparaciones
      posteriores (BR-REP-028). "Desiste sin Detalles" (el cliente no continua)
      es el desistimiento propio de esta etapa, separado de la autorizacion por
      Detalle: sigue a PROC-REP-306 (cancelacion temprana, BR-REP-027) y desde
      alli su custodia, saldo y cierre (BR-REP-033, BR-REP-038). Registra fecha
      y hora, usuario responsable y resultado (y el motivo del desistimiento).
      Si el cliente todavia no decidio no hay arista: la Orden permanece
      EN_REVISION, sin comprobante, hasta que Recepcion registre el resultado;
      no se registra una decision ficticia. Si la revision tecnica concluye que
      no corresponde ninguna reparacion se usa el circuito SIN_REPARACION
      existente (PROC-REP-068 -> PROC-REP-069), sin crear un Detalle ficticio.
    inputs:
      - Orden EN_REVISION sin Detalles
    outputs:
      - Decision del cliente sobre la revision tecnica (acepta / desiste)
      - Fecha/hora, usuario responsable y motivo del desistimiento cuando corresponde
    rules:
      - BR-REP-027
      - BR-REP-028
      - BR-REP-031

  - id: PROC-REP-060
    type: activity
    name: Generar comprobante de recepcion
    actor: ACT-SYSTEM
    description: >
      Se genera el documento que acredita que el cliente dejo el equipo
      para ser reparado, para ordenes cuyo origen lo requiere
      (CLIENTE_EXTERNO, RT_GARANTIA_VENTA, RMA_GARANTIA_REPARACION). Si
      los Detalles ya se conocen, el comprobante los lista. Si la Orden
      esta EN_REVISION, el comprobante muestra la Orden, el cliente y el
      equipo, e indica conceptualmente "reparacion pendiente de
      diagnostico", sin inventar ningun Detalle ni Tipo de Reparacion. V1.4
      (CLIENTE_EXTERNO): se emite una unica vez, despues de la decision inicial
      del cliente; refleja los trabajos AUTORIZADOS con su definicion vigente
      o, si no hay Detalles, la reparacion pendiente de diagnostico. No se
      regenera automaticamente por cambios posteriores de Detalles
      (PROC-REP-075, PROC-REP-127), y no se genera si el cliente desiste antes
      de aceptar el ingreso (BR-REP-031).
      Custodia (V1.4): el comprobante es el documento que se intercambia por el
      equipo fisico, pero GENERARLO no confirma el intercambio fisico. La
      custodia comienza cuando se confirma que el comprobante se entrego y el
      equipo se recibio (BR-REP-033); esa confirmacion es un registro asociado
      al comprobante (fecha/hora, usuario responsable y referencia del
      comprobante), no un paso adicional del grafo: el flujo no espera el
      intercambio y la Orden puede existir sin equipo recibido. Un comprobante
      generado y no entregado no activa la custodia ni se interpreta como
      equipo recibido o no recibido. Eleccion minima: se extiende este nodo en
      lugar de agregar un nodo posterior, porque un nodo de espera impondria al
      grafo secuencial un orden que el negocio no exige. La simple creacion de
      la Orden no implica que el equipo este en el taller.
    outputs:
      - Comprobante de recepcion generado
      - Confirmacion del intercambio fisico (fecha/hora, usuario responsable y referencia del comprobante) cuando se concreta; hasta entonces la recepcion queda pendiente de confirmar
    rules:
      - BR-REP-031
      - BR-REP-033

  - id: PROC-REP-065
    type: activity
    name: Realizar revision tecnica
    actor: ACT-TECH
    description: >
      Para una Orden EN_REVISION, el tecnico revisa/diagnostica el equipo
      y registra el resultado de la revision. Ese resultado es el insumo
      para definir, a continuacion, los Detalles de reparacion requeridos
      (PROC-REP-075).
    outputs:
      - Resultado de revision tecnica

  - id: PROC-REP-068
    type: decision
    name: Se pudo definir la reparacion requerida
    description: >
      Distingue si, luego de la revision tecnica, se pudo determinar que
      Detalle o Detalles de reparacion necesita el equipo.

  - id: PROC-REP-069
    type: activity
    name: Registrar finalizacion sin reparacion
    actor: ACT-RECEP
    description: >
      La revision tecnica no permitio determinar ningun Detalle de
      reparacion. La Orden fue procesada correctamente pero concluye sin
      que se haya definido ni realizado ninguna reparacion: resultado
      SIN_REPARACION. En V1.3 no existe Diagnostico cobrable: la revision
      tecnica (PROC-REP-065) puede realizarse para determinar que
      reparacion necesita el equipo, pero no es por si misma un Detalle de
      Reparacion, no genera precio ni Subtotal, y no se crea un Tipo de
      Reparacion "Diagnostico" en V1.3. Por lo tanto SIN_REPARACION implica
      Subtotal = 0: no existe reparacion realizada ni importe cobrable
      asociado (BR-REP-010 V1.3). Si en el futuro Rosario Tecno decide
      cobrar el diagnostico, sera una nueva regla/capacidad a diseñar,
      fuera de alcance de V1.3. SIN_REPARACION no equivale a CANCELADA (una
      Orden cancelada fue interrumpida; una Orden SIN_REPARACION fue
      procesada hasta su fin sin necesitar o poder realizarse una
      reparacion). El motivo es obligatorio; ejemplos conceptuales: no se
      pudo determinar la falla, equipo no reparable, reparacion no
      disponible, otro. No se define todavia un catalogo rigido de
      motivos.
    outputs:
      - Resultado SIN_REPARACION
      - Motivo (obligatorio)
      - Observaciones de diagnostico/revision
      - Usuario que registra la decision
      - Fecha
    rules:
      - BR-REP-010

  - id: PROC-REP-070
    type: activity
    name: Definir Detalles de reparacion requeridos
    actor: ACT-RECEP
    description: >
      Se registran uno o mas Detalles de Reparacion (cantidad_detalles pasa de
      0 a >=1), cada uno con su Tipo de Reparacion y, en consecuencia, su
      precio snapshot vigente (BR-REP-015). Reemplaza a la version singular de
      V1.2 ("definir requerimiento de reparacion"): una misma Orden puede
      tener, por ejemplo, un Detalle de cambio de bateria y otro de cambio de
      pantalla. Recepcion agrega los Detalles de a uno; agregar un Detalle NO
      cierra la definicion: la carga se cierra con una accion explicita
      distinta ("Finalizar definicion", que exige al menos un Detalle) y
      recien entonces el proceso continua: en CLIENTE_EXTERNO a la decision del
      cliente por Detalle (PROC-REP-046) y luego, por el enrutamiento interno de
      PROC-REP-211, al comprobante (PROC-REP-050); en los demas origenes
      directamente a PROC-REP-050. Cada
      Detalle registra el origen de su diagnostico: RECEPCION cuando proviene
      de lo diagnosticado en el ingreso (BR-REP-026). El precio snapshot
      existe en todo Detalle, cualquiera sea el origen: precio registrado no
      implica pago requerido (la condicion comercial del origen determina si
      se cobra).
    inputs:
      - Orden de Reparacion
    outputs:
      - Detalle(s) de Reparacion creados, cada uno con Tipo, precio snapshot y origen del diagnostico (RECEPCION)
    rules:
      - BR-REP-001
      - BR-REP-026

  - id: PROC-REP-075
    type: activity
    name: Definir Detalles de reparacion luego de revision
    actor: ACT-TECH
    description: >
      V1.4: el TECNICO (ACT-TECH) define y registra los Detalles de
      Reparacion requeridos de una Orden que estaba EN_REVISION, a partir del
      resultado de la revision tecnica inicial (PROC-REP-065/068) que el mismo
      realizo (misma logica que PROC-REP-070, que sigue a cargo de Recepcion
      como definicion preliminar): cada Detalle con su Tipo de Reparacion y su
      precio snapshot vigente (BR-REP-015). Registra, por cada Detalle, el
      tecnico que lo definio, la fecha/hora y la referencia a la revision
      inicial (PROC-REP-065) que lo origino. Definir tecnicamente un Detalle NO
      es autorizarlo: la autorizacion del cliente es una dimension distinta
      que gestiona Recepcion. Tambien aqui los Detalles se agregan de a uno y
      la carga se cierra con la accion explicita "Finalizar definicion";
      recien entonces el proceso continua: en CLIENTE_EXTERNO a la nueva
      decision del cliente sobre los Detalles hallados (PROC-REP-046, a cargo
      de Recepcion, la aceptacion previa de la revision NO los autoriza) y luego
      a PROC-REP-080; en los demas origenes directamente a PROC-REP-080, sin
      regenerar el comprobante de recepcion (se emitio antes del
      diagnostico). Estos Detalles registran como origen de su diagnostico
      REVISION_TECNICA (BR-REP-026) y, por haber sido diagnosticados por el
      propio tecnico, NO requieren una segunda confirmacion tecnica
      independiente (BR-REP-035). En una garantia RMA -que siempre pasa por
      aqui- cada Detalle nuevo referencia uno de los Detalles origen
      identificados en PROC-REP-035 (BR-REP-019); no se impone una relacion
      1:1: un mismo Detalle origen puede originar mas de un Detalle nuevo. El
      precio snapshot existe en todo Detalle, cualquiera sea el origen: precio
      registrado no implica pago requerido (la condicion NO_COBRABLE del
      origen determina que no se cobra).
    inputs:
      - Resultado de revision tecnica
    outputs:
      - Detalle(s) de Reparacion creados, cada uno con Tipo y precio snapshot
      - Origen del diagnostico REVISION_TECNICA, tecnico que lo definio, fecha/hora y referencia a la revision inicial (PROC-REP-065)
    rules:
      - BR-REP-001
      - BR-REP-019

  - id: PROC-REP-080
    type: activity
    name: Validar factibilidad por Detalle
    actor: ACT-SYSTEM
    description: >
      Se evalua, para cada Detalle de la Orden, la disponibilidad prevista
      de insumos segun su Tipo de Reparacion (insumos previstos por Tipo
      de Reparacion). En este paso solo se CONSULTA disponibilidad: no se
      reserva todavia (la reserva real ocurre recien al iniciar la
      Ejecucion de un Detalle, ver PROC-REP-185/186). Un Detalle sin
      recursos disponibles queda DEFINIDO con condicion
      BLOQUEADO_POR_RECURSOS; esto no afecta a los demas Detalles de la
      misma Orden. V1.4: la factibilidad es una dimension distinta de la
      autorizacion del cliente -no se confunde stock disponible con
      autorizacion-: en CLIENTE_EXTERNO se evalua sobre Detalles AUTORIZADOS (un
      Detalle pendiente de autorizacion no es trabajable aunque haya stock), y
      tambien se reevalua para un Detalle nuevo o redefinido y autorizado
      despues de habilitar la Orden, sin reiniciar el ingreso ni invalidar los
      hitos previos (BR-REP-034).
    rules:
      - BR-REP-001
      - BR-REP-002
      - BR-REP-028

  - id: PROC-REP-090
    type: decision
    name: Existe al menos un Detalle trabajable
    description: >
      Pregunta agregada a nivel Orden (ver resolver de estado de Orden,
      docs/discovery/README.md): no exige que todos los Detalles sean
      factibles, solo que exista al menos uno sin bloqueo
      (es_trabajable = true). Reemplaza a la version V1.2 ("estan
      disponibles los recursos necesarios"), que evaluaba la Orden como
      un todo-o-nada. V1.4: es_trabajable exige ademas autorizacion vigente en
      CLIENTE_EXTERNO (BR-REP-028). Es el gate de habilitacion INICIAL: si la
      Orden ya fue habilitada (PROC-REP-140 cumplido), este nodo no vuelve a
      habilitarla ni a pedir prioridad ni a encolarla -podria estar tomada o en
      reparacion-: su resultado se enruta por el resolver (PROC-REP-211),
      arista "Orden ya habilitada" (BR-REP-034). La condicion usa el HITO
      historico de habilitacion, no el estado agregado actual, se evalua
      sobre el hito, no sobre las demas aristas, por lo que las tres salidas son
      mutuamente excluyentes y completas: "Orden ya habilitada" -> 211,
      "Primera habilitacion, existe Detalle trabajable" -> 140 y "Primera
      habilitacion, ninguno trabajable" -> 100; conserva
      la prioridad de cola, la toma activa y las participaciones de tecnicos.
    rules:
      - BR-REP-034

  - id: PROC-REP-100
    type: activity
    name: Registrar advertencia de faltante
    actor: ACT-SYSTEM
    description: >
      El sistema informa, para el/los Detalle(s) sin ningun recurso
      disponible, los insumos o condiciones que impiden que sean
      trabajables. No se emite una advertencia generica de "la Orden": se
      identifica el Detalle especifico afectado.

  - id: PROC-REP-110
    type: decision
    name: Usuario autorizado fuerza el Detalle bloqueado
    description: >
      Decision del circuito "ningun Detalle trabajable" (PROC-REP-100):
      distingue si un usuario autorizado decide forzar igualmente como
      trabajable un Detalle bloqueado por recursos. Es "Si" cuando el
      Coordinador autoriza el override de un Detalle mediante la capacidad
      transversal de override de recursos (BR-REP-003): la autorizacion se
      registra sobre ese Detalle especifico, no sobre la Orden en abstracto.
      Es "No" cuando se decide esperar (PROC-REP-120).

  - id: PROC-REP-120
    type: activity
    name: Detalle(s) pendientes por recursos
    actor: ACT-SYSTEM
    description: >
      Mientras ningun Detalle de la Orden sea trabajable y exista al
      menos uno bloqueado por recursos, el resolver de estado de Orden
      determina el agregado PENDIENTE_RECURSOS (ver docs/discovery/
      README.md). Esto no es una transicion manual de "toda la Orden
      espera": es la consecuencia derivada de la situacion de sus
      Detalles, y deja de aplicar en cuanto cualquier Detalle se vuelva
      trabajable (por disponibilidad real o por override). Se alcanza
      tanto desde la validacion inicial de factibilidad
      (PROC-REP-090/100/110) como, en V1.3, desde una reevaluacion
      posterior (PROC-REP-211) tras una Ejecucion, un rechazo de control o
      una cancelacion: en ningun caso una Orden PENDIENTE_RECURSOS vuelve
      directamente a EN_COLA (PROC-REP-170); permanece esperando hasta que
      un evento de revalidacion (por ejemplo, cambio de disponibilidad de
      insumos) dispare nuevamente PROC-REP-080. No debe confundirse con
      REQUIERE_REVISION (PROC-REP-125): son dos agregados distintos.

  - id: PROC-REP-125
    type: activity
    name: Detalle(s) pendientes de revision tecnica
    actor: ACT-SYSTEM
    description: >
      Nodo nuevo en V1.3, analogo a PROC-REP-120 pero para la dimension
      distinta de bloqueo: mientras ningun Detalle de la Orden sea
      trabajable y exista al menos uno que requiere revision
      (requiere_revision = true), el resolver de estado de Orden determina
      el agregado tecnico REQUIERE_REVISION (BR-REP-012). REQUIERE_REVISION
      es deliberadamente distinto del estado de workflow EN_REVISION (ver
      docs/discovery/README.md - "Resolver de estado de Orden"): no se
      mezclan entre si. Una Orden REQUIERE_REVISION tampoco vuelve
      directamente a EN_COLA (PROC-REP-170): permanece en este circuito de
      revision tecnica posterior hasta que se complete la definicion
      pendiente de ese Detalle en particular. No reutiliza el circuito
      inicial de revision de la Orden completa (PROC-REP-050, 055, 060,
      065, 068, 069): ese circuito narra el caso "la Orden todavia no
      tiene ningun Detalle" y, entre otras cosas, puede regenerar el
      comprobante de recepcion o concluir la Orden entera en
      SIN_REPARACION -efectos que no corresponden aqui, donde ya existen
      uno o mas Detalles definidos y lo pendiente es solo sobre alguno en
      particular-. Se alcanza desde PROC-REP-211 cuando el resolver
      devuelve REQUIERE_REVISION. A diferencia de PROC-REP-120 (donde la
      revalidacion es directamente PROC-REP-080, porque el bloqueo es de
      disponibilidad de insumos), aqui PROC-REP-080 no puede resolver la
      causa: un Detalle con condicion REQUIERE_DEFINICION primero necesita
      una accion tecnica que le quite esa condicion (PROC-REP-126,
      PROC-REP-127) antes de que tenga sentido validar su factibilidad. La
      espera representa un evento posterior -que se realice la revision
      tecnica pendiente de ese Detalle-, nunca un loop inmediato
      automatico. REQUIERE_DEFINICION lo asigna PROC-REP-200 (resultado
      Requiere redefinicion), no este nodo: PROC-REP-125 solo representa
      la espera. No cambia el workflow, no modifica el Detalle y no
      realiza la revision automaticamente. Se alcanza unicamente desde
      PROC-REP-211 con resultado REQUIERE_REVISION, es decir cuando ningun
      Detalle es trabajable y existe al menos uno DEFINIDO con
      REQUIERE_DEFINICION (si otro Detalle sigue trabajable el resolver
      devuelve ABIERTA_TRABAJABLE y no se llega aqui todavia).
    rules:
      - BR-REP-012

  - id: PROC-REP-126
    type: activity
    name: Realizar revision tecnica de Detalle pendiente
    actor: ACT-TECH
    description: >
      Nodo nuevo en V1.3, analogo a PROC-REP-065 pero acotado a un unico
      Detalle EXISTENTE marcado REQUIERE_DEFINICION -no a la Orden
      completa sin Detalles-. El tecnico revisa/diagnostica
      especificamente ese Detalle pendiente y registra el resultado de la
      revision, que queda trazado en el historial de ese mismo Detalle:
      no se crea un Detalle nuevo. No regenera el comprobante de
      recepcion ni reevalua el origen de la Orden -eso pertenece
      unicamente al circuito inicial (PROC-REP-050 a 069), que no se
      reutiliza aqui-. Debe registrar usuario, fecha, Detalle y
      resultado/observaciones tecnicas. Todavia NO modifica Tipo de
      Reparacion, precio, puntaje ni garantia del Detalle (eso es
      PROC-REP-127). No crea una nueva toma de Orden: esta revision puntual
      no pasa por PROC-REP-170 -> 172 -> 180.
    outputs:
      - Resultado de revision tecnica del Detalle

  - id: PROC-REP-127
    type: activity
    name: Definir/actualizar reparacion del Detalle
    actor: ACT-TECH
    description: >
      Nodo nuevo en V1.3, analogo a PROC-REP-070/075 pero acotado a
      actualizar un Detalle YA EXISTENTE -no crea uno nuevo-. V1.4: quien
      registra la redefinicion es el TECNICO (ACT-TECH), porque toda
      redefinicion se origina en una revision o evaluacion tecnica: el
      resultado de PROC-REP-126 (revision posterior a una Ejecucion
      interrumpida) o la evaluacion tecnica previa a la ejecucion
      (PROC-REP-183, REQUIERE_REDEFINICION, aplicada de inmediato).
      Recepcion NO registra redefiniciones tecnicas: conserva la definicion
      preliminar inicial (PROC-REP-070) y la consulta al cliente con el
      registro de su autorizacion o desistimiento (PROC-REP-046/047). A partir
      del resultado tecnico, el tecnico define o actualiza el Tipo de
      Reparacion del Detalle pendiente y su precio snapshot vigente
      (BR-REP-015), y se quita la condicion REQUIERE_DEFINICION de ese
      Detalle cuando corresponda -pasa a SIN_BLOQUEO, salvo que ademas
      resulte BLOQUEADO_POR_RECURSOS, lo que recien se determina en
      PROC-REP-080-. El Detalle conserva su identidad e historial
      completo (incluidas las revisiones y evaluaciones tecnicas), sus
      Ejecuciones anteriores y, en una garantia RMA, su vinculo al Detalle
      origen y a la Orden origen (BR-REP-019): no se modifican.
      PROC-REP-127 genera una NUEVA definicion vigente (Tipo de Reparacion y
      snapshots de precio, puntaje y garantia segun la confirmacion actual) y
      conserva historicamente la definicion anterior (BR-REP-015), junto con
      el tecnico responsable y la fecha/hora del reemplazo. Aunque se
      confirme el mismo Tipo de Reparacion, igual es una nueva redefinicion:
      invalida cualquier override de factibilidad previo (PROC-REP-130,
      BR-REP-003) y obliga a reevaluar los recursos desde cero en
      PROC-REP-080. Tambien invalida la autorizacion del cliente de la
      definicion anterior (BR-REP-029): en CLIENTE_EXTERNO el Detalle
      redefinido vuelve a PROC-REP-046 para una nueva decision antes de
      PROC-REP-080; los demas origenes continuan directamente a PROC-REP-080.
      V1.4: tambien se alcanza desde la evaluacion tecnica previa a la
      ejecucion, sin pasar por la espera de PROC-REP-125/126: el resultado de
      la evaluacion tecnica cumple el rol de la revision tecnica previa. Una
      definicion nueva que nace de una evaluacion o revision tecnica queda
      tecnicamente validada por ese mismo acto y no exige una confirmacion
      redundante (BR-REP-035); la autorizacion del cliente se pide
      igualmente (BR-REP-029). Agregar otros Detalles (PROC-REP-128) no
      invalida la autorizacion del Detalle original ni su definicion.
    inputs:
      - Resultado de revision o evaluacion tecnica del Detalle
    outputs:
      - Detalle actualizado con Tipo de Reparacion y precio snapshot
      - Definicion anterior conservada historicamente
    rules:
      - BR-REP-001
      - BR-REP-015

  - id: PROC-REP-128
    type: activity
    name: Agregar Detalle detectado durante la ejecucion
    actor: ACT-TECH
    description: >
      Nodo nuevo en V1.4. Un TECNICO (ACT-TECH) detecta una reparacion
      adicional necesaria cuando la Orden ya tiene otros Detalles (por
      ejemplo, trabajando un cambio de bateria descubre que tambien hace falta
      el pin de carga) y registra el NUEVO ReparacionDetail: el tecnico es
      el responsable de definir tecnicamente este trabajo, no Recepcion. El
      Detalle registra su Tipo de Reparacion, precio snapshot (BR-REP-015),
      el tecnico que lo detecto y registro, fecha/hora y trazabilidad, con
      origen del diagnostico REVISION_TECNICA (BR-REP-026, BR-REP-032) y,
      cuando se detecto durante una evaluacion tecnica (PROC-REP-183), la
      referencia a esa evaluacion. En CLIENTE_EXTERNO el alta CREA la solicitud
      de autorizacion: el Detalle nace PENDIENTE_AUTORIZACION, el tecnico NO
      puede iniciarlo y queda visible para Recepcion, que consulta al cliente
      y registra AUTORIZADO o RECHAZADO sobre la definicion vigente de ESTE
      Detalle, con decision propia, cuando pueda (PROC-REP-046/047, entrada
      EVT-REP-003). La RESOLUCION de la solicitud es diferida e independiente:
      no se exige una respuesta inmediata del cliente, la ausencia de respuesta
      no equivale a autorizacion ni a rechazo, y el hilo tecnico NO pasa por
      PROC-REP-046/047 (BR-REP-037). Si se autoriza, el Detalle pasa por
      factibilidad (PROC-REP-080) antes de ser ejecutable; si se rechaza, se
      cancela con PROC-REP-300 conservando el historial. No inicia ejecucion
      ni reserva insumos (BR-REP-006: la reserva real es de PROC-REP-185 y
      exige un Detalle trabajable) ni es candidato de estacion
      (PROC-REP-172/174 solo consideran Detalles trabajables). Los demas
      Detalles habilitados continuan normalmente y las Ejecuciones activas NO
      se interrumpen: este nodo no cierra la toma ni toca la Ejecucion vigente
      (BR-REP-018, BR-REP-007); la resolucion de la solicitud es concurrente
      con la ejecucion de otro Detalle (DET-001 sigue EN_PROGRESO mientras
      DET-002 espera su decision). Registrar un Detalle nuevo NO invalida la
      autorizacion ni la definicion del Detalle original. Para los demas
      origenes no hay decision de cliente y continua directo a PROC-REP-080.
      Se alcanza desde dos contextos con salidas distintas y excluyentes:
      durante la ejecucion, desde PROC-REP-190 (simplificacion del diagrama: es
      el punto donde el tecnico esta trabajando, aunque puede ocurrir en
      cualquier momento de su participacion), con retorno directo a
      PROC-REP-190 en CLIENTE_EXTERNO (la Ejecucion vigente continua) o a la
      factibilidad (PROC-REP-080) en los demas origenes; y durante la
      evaluacion tecnica previa a la ejecucion, desde PROC-REP-184, como accion
      COMPLEMENTARIA al resultado principal de la evaluacion (cero, una o
      varias altas, que vuelven a PROC-REP-184) y no como un resultado
      alternativo. No reutiliza PROC-REP-075 (orientado a la definicion
      posterior a una revision inicial de una Orden sin Detalles).
    inputs:
      - Orden con Detalles y participacion activa del tecnico
      - Reparacion adicional detectada por el tecnico
    outputs:
      - Detalle nuevo con Tipo, precio snapshot y origen del diagnostico REVISION_TECNICA
      - Solicitud de autorizacion creada (autorizacion inicial propia PENDIENTE_AUTORIZACION en CLIENTE_EXTERNO, pendiente de gestion diferida por Recepcion)
      - Tecnico que lo detecto y registro, y fecha/hora de alta
      - Referencia a la evaluacion tecnica durante la cual se detecto, cuando corresponde
    rules:
      - BR-REP-026
      - BR-REP-032
      - BR-REP-037

  - id: PROC-REP-129
    type: activity
    name: Detalle(s) pendientes de autorizacion del cliente
    actor: ACT-SYSTEM
    description: >
      Nodo nuevo en V1.4 de FEAT-REP-002, analogo a PROC-REP-120 (espera de
      recursos) y PROC-REP-125 (espera de revision) pero para la autorizacion
      del cliente. Se alcanza desde PROC-REP-211 cuando el resolver devuelve
      PENDIENTE_AUTORIZACION: ningun Detalle es trabajable y existe al menos
      uno pendiente de autorizacion (por ejemplo, todos los Detalles no
      terminales, o un Detalle COMPLETO mas otro pendiente: la Orden no pasa
      al control final mientras siga abierta la decision). La Orden NO
      ingresa a la cola. Si existia una toma/participacion activa, el sistema
      la cierra automaticamente (BR-REP-018). No cambia el workflow ni
      modifica los Detalles; la espera termina cuando Recepcion registra la
      decision (PROC-REP-046/047). Aplica solo a CLIENTE_EXTERNO. Es una
      espera de Recepcion y del cliente, no del tecnico: solo se alcanza cuando
      NINGUN Detalle es trabajable; mientras exista uno, el tecnico continua con
      el y la solicitud se gestiona por EVT-REP-003 (BR-REP-037).
    rules:
      - BR-REP-012
      - BR-REP-028
      - BR-REP-037

  - id: PROC-REP-130
    type: activity
    name: Registrar override
    actor: ACT-COORD
    description: >
      En el circuito "ningun Detalle trabajable" (PROC-REP-100 -> 110 Si),
      registra que la Orden continua hacia la habilitacion (PROC-REP-140)
      gracias a la autorizacion de override de un Detalle especifico. La
      autorizacion en si -usuario, fecha, Detalle, validacion ignorada y
      motivo (BR-REP-003)- es una capacidad transversal por Detalle
      documentada fuera del grafo (docs/discovery/README.md, "Capacidades
      transversales"): tambien puede ocurrir sobre un Detalle bloqueado por
      recursos mientras otros Detalles de la Orden son trabajables
      (factibilidad parcial, con la Orden habilitada, en cola, tomada o en
      reparacion). En ese caso no se recorre este nodo ni se altera la
      posicion del flujo: el Detalle simplemente queda disponible. Mismo
      rol/actor (ACT-COORD) y misma Business Rule que en V1.2.
    outputs:
      - Usuario responsable
      - Fecha
      - Detalle
      - Motivo
      - Validacion ignorada
    rules:
      - BR-REP-003

  - id: PROC-REP-140
    type: activity
    name: Habilitar Orden de Reparacion
    actor: ACT-SYSTEM
    description: >
      La Orden pasa a HABILITADA y queda en condiciones de ingresar al
      circuito operativo. El gate ya no exige que todos los Detalles sean
      factibles: alcanza con que exista al menos uno trabajable
      (PROC-REP-090). Los demas Detalles bloqueados siguen existiendo y
      podran volverse trabajables mas adelante sin bloquear el avance de
      la Orden.

  - id: PROC-REP-150
    type: activity
    name: Definir prioridad
    actor: ACT-COORD
    description: >
      El coordinador establece inicialmente la prioridad de ejecucion
      de la Orden. El catalogo definitivo de prioridades queda pendiente.
      Sin cambios respecto de V1.2 (prioridad sigue siendo de la Orden,
      no de cada Detalle). V1.4: se recorre una unica vez, en la primera
      habilitacion. Agregar, modificar o autorizar un Detalle de una Orden ya
      habilitada NO vuelve aqui ni modifica la prioridad existente (BR-REP-034).
      La prioridad solo cambia por una accion explicita y autorizada, con
      trazabilidad (usuario, fecha/hora y valores anterior y nuevo), que
      reutiliza esta capacidad; no se crea un proceso de priorizacion nuevo.

  - id: PROC-REP-170
    type: activity
    name: Ingresar orden a cola de trabajo
    actor: ACT-SYSTEM
    description: >
      La Orden pasa a EN_COLA, disponible para que cualquier tecnico
      pueda tomarla. El coordinador no asigna obligatoriamente el
      tecnico. Este nodo tambien es el punto de referencia desde el que,
      conceptualmente, puede cancelarse un Detalle (PROC-REP-300) o la
      Orden completa (PROC-REP-305) mientras esta disponible/en curso;
      ver la nota de PROC-REP-300 sobre esta simplificacion del diagrama.

  - id: PROC-REP-172
    type: activity
    name: Validar estacion de trabajo
    actor: ACT-SYSTEM
    description: >
      Se dispara cuando un tecnico intenta tomar una Orden EN_COLA. El
      sistema valida, en este orden conceptual: (1) sesion activa; (2)
      estacion asociada/confirmada; (3) estacion configurada; (4)
      estacion OPERATIVA; (5) que no exista ya una Ejecucion activa sobre
      esta Orden (maximo una por Orden, BR-REP-007); (6) que exista al
      menos un Detalle trabajable cuyo Tipo de Reparacion este habilitado
      para esta Estacion -no es necesario que todos los Detalles sean
      compatibles-. Si (1)-(4) o (5) fallan, o si ningun Detalle
      trabajable es compatible con la Estacion, la Orden NO puede tomarse
      desde aqui: no existe override generico a nivel Orden en ninguno de
      estos casos (BR-REP-011 V1.3, alcance A). La Orden permanece EN_COLA
      para otra estacion o para un nuevo intento. La compatibilidad
      especifica con el Detalle que efectivamente se trabaje se revalida
      recien al seleccionarlo (PROC-REP-174). V1.4: la toma de la Orden NO exige
      que sus Detalles ya esten confirmados tecnicamente; el tecnico toma una
      Orden con trabajos elegibles y luego evalua el Detalle seleccionado
      (PROC-REP-182/183), sin crear una toma nueva (BR-REP-035).
    outputs:
      - Resultado de validacion de sesion/estacion/compatibilidad agregada
    rules:
      - BR-REP-011

  - id: PROC-REP-180
    type: activity
    name: Tomar Orden de Reparacion
    actor: ACT-TECH
    description: >
      El tecnico toma la Orden completa -no solo un Detalle- al superar
      PROC-REP-172: se abre una toma/participacion activa (Orden +
      Tecnico + Estacion + fecha/hora de inicio), como maximo UNA por
      Orden en simultaneo (BR-REP-018 V1.3, distinto pero complementario
      de BR-REP-007 que limita a una Ejecucion activa). A diferencia de
      V1.2, esto no implica posesion exclusiva de por vida ni un modo
      EXCLUSIVA/ABIERTA: distintos tecnicos pueden tomar la misma Orden en
      distintos momentos (nunca al mismo tiempo). Mientras la toma este
      activa, el tecnico puede seleccionar y trabajar varios Detalles de
      la misma Orden sin volver a tomarla (PROC-REP-181 -> ... ->
      PROC-REP-211 -> PROC-REP-212 "Si"). La toma se cierra explicitamente
      cuando el tecnico decide liberar la Orden (PROC-REP-212 "No" ->
      PROC-REP-213), o automaticamente cuando el resolver determina que ya
      no queda ningun Detalle trabajable (Orden pasa a COMPLETA,
      PENDIENTE_RECURSOS, REQUIERE_REVISION o TODO_CANCELADO). El
      historial completo de participaciones se conserva siempre. A
      continuacion el tecnico selecciona un Detalle especifico para
      trabajar (PROC-REP-181): tomar la Orden no inicia por si sola
      ninguna Ejecucion.
    rules:
      - BR-REP-018

  - id: PROC-REP-181
    type: activity
    name: Seleccionar Detalle a trabajar
    actor: ACT-TECH
    description: >
      Con la Orden tomada, el tecnico elige un Detalle trabajable de la
      Orden (puede haber mas de uno disponible; el tecnico elige cual
      trabajar ahora). Nodo nuevo en V1.3: en V1.2 no existia porque una
      Orden solo tenia una reparacion. Tambien se re-ingresa a este nodo
      cuando un intento de trabajar un Detalle no prospera (estacion
      incompatible sin override, o reserva de insumos fallida), para que
      el tecnico pueda elegir otro Detalle trabajable si lo hay. V1.4: un
      Detalle PENDIENTE_AUTORIZACION no es trabajable y no se puede
      seleccionar ni iniciar, aunque otros Detalles de la misma Orden si
      (BR-REP-028). V1.4: un Detalle pendiente de confirmacion tecnica SI es
      seleccionable (elegible); tras seleccionarlo se evalua si requiere
      evaluacion tecnica previa (PROC-REP-182) antes de las validaciones de
      estacion y de la reserva.
    rules:
      - BR-REP-028

  - id: PROC-REP-174
    type: decision
    name: Estacion habilitada para el Detalle seleccionado
    description: >
      Reubicado en V1.3: en V1.2 evaluaba la compatibilidad de la
      Estacion contra "la" reparacion de la Orden, en el momento de
      tomarla. En V1.3 evalua la compatibilidad de la Estacion actual
      contra el Tipo de Reparacion del Detalle especifico que el tecnico
      acaba de seleccionar en PROC-REP-181 -no contra toda la Orden-. V1.4: solo
      se alcanza despues de PROC-REP-182/183, es decir con la evaluacion tecnica
      requerida ya cumplida.

  - id: PROC-REP-176
    type: activity
    name: Registrar advertencia de estacion incompatible (Detalle)
    actor: ACT-SYSTEM
    description: >
      La Estacion esta OPERATIVA, pero no esta configurada entre las
      estaciones habilitadas para el Tipo de Reparacion del Detalle
      seleccionado. Reubicado en V1.3 (antes evaluaba la Orden completa).
      Luego debe evaluarse si se desea forzar la continuidad
      (PROC-REP-178).
    rules:
      - BR-REP-011

  - id: PROC-REP-178
    type: decision
    name: Usuario autorizado fuerza continuidad (Detalle)
    description: >
      Distingue si un usuario autorizado decide forzar el inicio de la
      Ejecucion de este Detalle desde una Estacion operativa pero no
      habilitada para su Tipo de Reparacion. Si no se fuerza, este
      Detalle en particular no se inicia desde esta Estacion ahora: el
      tecnico puede seleccionar otro Detalle trabajable (PROC-REP-181).
      La Orden no vuelve a EN_COLA por este motivo: sigue tomada, solo
      cambia que Detalle se intenta trabajar.
    rules:
      - BR-REP-011

  - id: PROC-REP-179
    type: activity
    name: Registrar override de estacion (Detalle)
    actor: ACT-COORD
    description: >
      Un usuario autorizado decide continuar a pesar de que la Estacion
      no esta configurada para el Tipo de Reparacion del Detalle
      seleccionado. El override autoriza unicamente la continuidad de
      trabajo sobre ese Detalle: no modifica automaticamente la
      configuracion de la Estacion.
    outputs:
      - Usuario responsable
      - Fecha/hora
      - Estacion
      - Detalle
      - Tipo de reparacion no habilitado
      - Motivo
    rules:
      - BR-REP-011

  - id: PROC-REP-182
    type: decision
    name: Evaluacion tecnica previa del Detalle seleccionado
    description: >
      Nodo nuevo en V1.4 de FEAT-REP-005. Se evalua con la Orden ya tomada y
      el Detalle ya seleccionado (PROC-REP-181), ANTES de las validaciones de
      estacion (PROC-REP-174) y de la reserva de insumos (PROC-REP-185): todo
      Detalle diagnosticado por Recepcion (origen del diagnostico RECEPCION)
      requiere una evaluacion tecnica VIGENTE antes de iniciar su primera
      Ejecucion (BR-REP-035). No existe camino a PROC-REP-185 que evite este
      nodo. Enruta segun el estado de la evaluacion de la DEFINICION VIGENTE del
      Detalle, con salidas mutuamente excluyentes y completas: "Requiere
      evaluacion tecnica" (origen RECEPCION sin evaluacion registrada sobre la
      definicion vigente) -> PROC-REP-183; "No requiere evaluacion tecnica"
      (origen REVISION_TECNICA, que ya fue diagnosticado por el propio
      tecnico, o evaluacion CONFIRMADO vigente) -> PROC-REP-174. Un Detalle
      descartado o con la definicion invalidada nunca llega aqui para ejecutar:
      el descarte se cancela y la redefinicion se registra de inmediato en el
      momento del resultado principal (PROC-REP-183), por lo que ese Detalle ya
      no es elegible. Tambien se pasa por aqui al volver a seleccionar un
      Detalle tras una estacion incompatible o una reserva fallida, o tras
      atender reparaciones adicionales (la evaluacion CONFIRMADO sigue vigente y
      el Detalle no se evalua de nuevo). No reserva ni consume insumos y no pide
      autorizacion del cliente. Distincion de dimensiones (BR-REP-012,
      BR-REP-035): un Detalle sin evaluar es ELEGIBLE para ser seleccionado y
      evaluado (por eso la Orden puede tomarse), pero no esta HABILITADO para
      iniciar la Ejecucion hasta que esta evaluacion lo permita.
    rules:
      - BR-REP-035

  - id: PROC-REP-183
    type: activity
    name: Evaluar tecnicamente Detalle diagnosticado por Recepcion
    actor: ACT-TECH
    description: >
      Nodo nuevo en V1.4 de FEAT-REP-005. El tecnico que tiene la Orden
      tomada evalua el Detalle seleccionado, de forma individual y sobre su
      definicion vigente, y registra EXACTAMENTE UN resultado principal:
      CONFIRMADO, DESCARTADO o REQUIERE_REDEFINICION (BR-REP-035,
      BR-REP-036). La traza de esta evaluacion contiene: ID del Detalle,
      version de la definicion evaluada, tecnico responsable, fecha/hora,
      resultado principal, motivo/observaciones (el motivo es obligatorio en
      DESCARTADO y REQUIERE_REDEFINICION) y el efecto aplicado. El resultado
      principal se aplica de INMEDIATO sobre el Detalle original, sin esperar a
      que se registren, consulten o evaluen las reparaciones adicionales
      (PROC-REP-184 / PROC-REP-128). CONFIRMADO: se conserva la autorizacion
      vigente del cliente, sin nueva definicion ni nueva consulta; el Detalle
      sigue elegible y habilitado para ejecutar y continua a PROC-REP-184.
      DESCARTADO: la reparacion diagnosticada no corresponde; desde el registro
      el Detalle deja de ser elegible (no puede seleccionarse, ejecutarse ni
      reservar insumos) y se cancela en ese mismo recorrido con PROC-REP-300
      (motivo tecnico DIAGNOSTICO_DESCARTADO, distinto del desistimiento del
      cliente), conservando su definicion historica. REQUIERE_REDEFINICION: desde
      el registro la definicion anterior queda invalidada y no puede ejecutarse;
      el tecnico registra en ese mismo recorrido la nueva definicion del mismo
      Detalle con PROC-REP-127 (identidad e historial conservados, autorizacion
      anterior invalidada, nueva decision del cliente en PROC-REP-046/047 y
      nueva factibilidad en PROC-REP-080); no se usa el circuito de espera de
      PROC-REP-125/126, pensado para una redefinicion posterior a una Ejecucion
      interrumpida. Un trabajo adicional detectado NO es un resultado de esta
      evaluacion ni una alternativa a ella: es una accion complementaria
      (PROC-REP-184 / PROC-REP-128) que el tecnico puede realizar con cualquiera
      de los tres resultados y no modifica el Detalle original. No crea una toma
      nueva, no reserva ni consume insumos y no sustituye la autorizacion del
      cliente. El efecto se aplica una sola vez: el resultado queda registrado
      sobre la definicion evaluada y, al volver por el resolver, el Detalle no
      se evalua, cancela ni redefine de nuevo.
    inputs:
      - Orden con toma activa y Detalle seleccionado (origen RECEPCION)
    outputs:
      - Evaluacion tecnica registrada (Detalle, version de la definicion evaluada, tecnico, fecha/hora, resultado principal, motivo/observaciones y efecto aplicado)
    rules:
      - BR-REP-035
      - BR-REP-036

  - id: PROC-REP-184
    type: decision
    name: Hay reparaciones adicionales detectadas por registrar
    description: >
      Nodo nuevo en V1.4 de FEAT-REP-005. Se alcanza DESPUES de aplicar el
      resultado principal de la evaluacion tecnica sobre el Detalle original
      (desde PROC-REP-183 para CONFIRMADO, desde PROC-REP-300 tras el descarte
      y desde PROC-REP-127 tras la redefinicion). El tecnico puede detectar
      cero, una o varias reparaciones adicionales, independientemente de ese
      resultado (BR-REP-036). "Otra reparacion adicional por registrar" ->
      PROC-REP-128 (el tecnico registra un Detalle nuevo, que vuelve aqui;
      repetible 0..N veces, y cada alta es un Detalle distinto, nunca una
      nueva evaluacion del Detalle original). Cada alta CREA la solicitud de
      autorizacion (Detalle PENDIENTE_AUTORIZACION), pero su resolucion NO es
      una espera del tecnico: la gestiona Recepcion por su carril propio
      (EVT-REP-003 -> PROC-REP-046/047, o PROC-REP-129 cuando ningun Detalle es
      trabajable) y ninguna salida de este nodo pasa por PROC-REP-046/047
      (BR-REP-037). Cuando no queda ninguna por registrar, el hilo tecnico
      continua: "Hay Detalles pendientes de factibilidad (origen distinto de
      CLIENTE_EXTERNO)" -> PROC-REP-080 (evaluacion del sistema, sin espera del
      cliente), cualquiera sea el resultado principal, y luego el resolver
      (PROC-REP-090 -> PROC-REP-211); "Original CONFIRMADO, sin Detalles
      pendientes de factibilidad" -> PROC-REP-182 (que lo enruta a PROC-REP-174
      porque su evaluacion esta vigente: el Detalle original sigue su camino a
      ejecucion aunque los adicionales continuen PENDIENTE_AUTORIZACION);
      "Original cancelado o redefinido, sin Detalles pendientes de
      factibilidad" -> PROC-REP-211, donde el resolver decide (continuar con
      otro Detalle trabajable, espera de autorizacion en PROC-REP-129, etc.). Solo
      asi se invoca el resolver despues de un descarte: la Orden no se cancela
      ni finaliza prematuramente si el Detalle descartado era el unico y el
      tecnico identifico otra reparacion que todavia debe registrarse. Un
      Detalle original CONFIRMADO no queda bloqueado por la decision pendiente de
      un adicional, y no se evalua de nuevo ni se duplican altas al
      reseleccionarlo. Cada Detalle adicional gestiona su autorizacion y su
      factibilidad de forma independiente, sin invalidar la autorizacion del
      Detalle original, sin interrumpir Ejecuciones de otros Detalles y
      conservando la toma activa y la prioridad de la Orden (BR-REP-034).
      Un solo token en el grafo: la independencia es semantica por Detalle y
      el carril de Recepcion se dibuja como entrada propia.
    rules:
      - BR-REP-032
      - BR-REP-036
      - BR-REP-037

  - id: PROC-REP-185
    type: activity
    name: Reservar insumos e iniciar Ejecucion del Detalle
    actor: ACT-SYSTEM
    description: >
      Reubicado en V1.3: en V1.2 se reservaba una unica vez "al tomar la
      Orden"; en V1.3 se intenta la RESERVA REAL de los insumos previstos
      del Detalle seleccionado recien en este momento (no en la
      factibilidad, que solo consulto disponibilidad). Si la reserva es
      exitosa, se generan las reservas trazadas a este Detalle, se crea
      la Ejecucion y el Detalle pasa a EN_PROGRESO (PROC-REP-190). Si la
      reserva falla -el insumo dejo de estar disponible entre la
      factibilidad original y este momento-, no se inicia la Ejecucion
      (PROC-REP-186). V1.4: solo se reserva para un Detalle trabajable, es
      decir con autorizacion vigente; un Detalle pendiente de autorizacion no
      reserva ni consume insumos (BR-REP-028, BR-REP-032). V1.4: ademas exige
      que el Detalle haya pasado por PROC-REP-182 (confirmacion tecnica vigente
      cuando su origen la requiere): no hay camino a este nodo sin ella, y la
      confirmacion tecnica no garantiza stock (BR-REP-035).
    rules:
      - BR-REP-006
      - BR-REP-028
      - BR-REP-035

  - id: PROC-REP-186
    type: activity
    name: Registrar reserva fallida (Detalle bloqueado por recursos)
    actor: ACT-SYSTEM
    description: >
      Nodo nuevo en V1.3, cierra el gap identificado entre la factibilidad
      (que solo consulta disponibilidad) y la reserva real. Cuando la
      reserva de insumos falla al intentar iniciar la Ejecucion, la
      Ejecucion NO se inicia, el Detalle permanece DEFINIDO con
      condicion BLOQUEADO_POR_RECURSOS, y el estado de la Orden se
      recalcula (PROC-REP-211) reutilizando el mismo mecanismo que la
      factibilidad inicial: si existe otro Detalle trabajable la Orden
      sigue operable; si no, puede resultar PENDIENTE_RECURSOS.
    rules:
      - BR-REP-006

  - id: PROC-REP-190
    type: activity
    name: Ejecutar Detalle
    actor: ACT-TECH
    description: >
      El tecnico trabaja sobre el Detalle cuya Ejecucion se acaba de
      iniciar. Reemplaza a "Ejecutar reparacion" de V1.2: ahora es un
      paso que se repite una vez por cada Detalle trabajado (ver el bucle
      PROC-REP-181 -> ... -> PROC-REP-211 -> PROC-REP-181). V1.4: mientras
      trabaja, el tecnico puede detectar una reparacion adicional y agregarla
      como Detalle nuevo (PROC-REP-128, arista "Detecta reparacion adicional");
      su Ejecucion vigente continua sin interrupcion (la arista a PROC-REP-200
      sigue siendo el recorrido por defecto). Limitacion de representacion: el
      grafo es secuencial; la consulta al cliente (PROC-REP-046/047) es una
      actividad independiente de Recepcion (entrada EVT-REP-003) y NO es un
      paso obligatorio del hilo tecnico: tras registrar el Detalle adicional
      (PROC-REP-128) el flujo vuelve directamente a este nodo en
      CLIENTE_EXTERNO, y la autorizacion o el rechazo posteriores se
      resuelven por el carril de Recepcion y vuelven al resolver
      (PROC-REP-211), que, cuando se invoca con una Ejecucion activa, devuelve
      EN_EJECUCION y vuelve aqui (PROC-REP-211 -> 190), sin nodos de
      paralelismo y sin interrumpir la Ejecucion vigente ni iniciar una
      segunda.

  - id: PROC-REP-200
    type: activity
    name: Registrar ejecucion real del Detalle
    actor: ACT-TECH
    description: >
      El tecnico confirma o modifica los trabajos efectivamente
      realizados, repuestos utilizados, cantidades y observaciones de
      esta Ejecucion. La Ejecucion puede finalizar de tres formas: (a)
      Completado: el Detalle pasa a COMPLETO; (b) Interrumpido: el
      tecnico se retira sin terminar, la Ejecucion queda registrada como
      historia (tecnico, estacion, inicio/fin, trabajo realizado,
      observaciones, insumos ya ocurridos) y el Detalle vuelve a
      DEFINIDO sin bloqueo -su definicion sigue siendo valida-,
      disponible para que el mismo u otro tecnico lo continue mas
      adelante con una nueva Ejecucion; (c) Requiere redefinicion: el
      tecnico descubre durante la Ejecucion que la definicion actual del
      Detalle ya no es valida o suficiente. NO completa el Detalle: cierra
      la Ejecucion como no completada (tecnicamente interrumpida), exige
      un motivo obligatorio, y deja el Detalle DEFINIDO con condicion
      REQUIERE_DEFINICION (este resultado es quien ASIGNA esa condicion;
      no existe un nodo aparte que la produzca). Los tres resultados
      continuan a PROC-REP-210. La diferencia funcional entre (b) y (c):
      Interrumpido deja la definicion vigente; Requiere redefinicion la
      invalida y obliga a pasar por la revision posterior (PROC-REP-125 a
      127). Nunca se sobrescribe una Ejecucion anterior.
    outputs:
      - Trabajo realizado
      - Repuestos y cantidades reales
      - Observaciones
      - Resultado de la Ejecucion (Completado / Interrumpido / Requiere redefinicion)
      - Motivo de redefinicion (obligatorio cuando el resultado es Requiere redefinicion)
    rules:
      - BR-REP-004

  - id: PROC-REP-210
    type: activity
    name: Generar movimientos de inventario
    actor: ACT-SYSTEM
    description: >
      A partir de la Ejecucion registrada (haya finalizado Completada,
      Interrumpida o con resultado Requiere redefinicion; ojo: el
      resultado funcional de PROC-REP-200 no es lo mismo que el estado de
      la Ejecucion, y Requiere redefinicion corresponde a una Ejecucion que
      termina tecnicamente interrumpida), los insumos reservados de ESE Detalle se consumen
      segun lo efectivamente utilizado y se liberan las reservas no
      utilizadas; se registran desperdicios cuando corresponda. Todo
      movimiento (RESERVADO -> CONSUMIDO / LIBERADO / DESPERDICIO) queda
      trazado hasta el Detalle que lo origino, y transitivamente hasta la
      Orden (Orden -> Detalle -> Insumo -> Movimiento). Tras este nodo no
      queda ninguna reserva activa asociada a la Ejecucion cerrada, sea
      cual sea su resultado.
    rules:
      - BR-REP-005

  - id: PROC-REP-211
    type: decision
    name: Evaluar situacion de la Orden
    description: >
      Nodo nuevo en V1.3: invoca el resolver centralizado de estado de
      Orden (docs/discovery/README.md, BR-REP-012) para decidir que sigue
      despues de finalizar una Ejecucion (PROC-REP-210), despues de un
      rechazo de control (PROC-REP-235), despues de cancelar un Detalle
      (PROC-REP-300) o despues de cancelar Detalles no terminales al
      cancelar la Orden (PROC-REP-305). No implementa una regla nueva:
      reutiliza la misma politica de prioridad ya usada en PROC-REP-090,
      evitando duplicar la logica en cada punto donde hace falta
      re-evaluar. Resultados posibles: (a) existe Detalle trabajable Y la
      Orden tiene una toma/participacion activa del tecnico actual ->
      pregunta si continua o libera la Orden (PROC-REP-212, BR-REP-018);
      (b) existe Detalle trabajable pero NO hay toma activa -> vuelve
      directamente a PROC-REP-170, disponible para que cualquier tecnico
      la tome; (c) todos terminales con al menos uno COMPLETO -> avanza a
      PROC-REP-220, sin importar si los demas Detalles quedaron CANCELADO
      (incluso viniendo de PROC-REP-305, una cancelacion de Orden con
      algun Detalle ya COMPLETO no impide continuar hacia control); (d)
      todos CANCELADO sin ningun COMPLETO -> la Orden pasa a CANCELADA,
      EVT-REP-999; (e) ninguno trabajable por bloqueo de recursos ->
      PENDIENTE_RECURSOS, PROC-REP-120; (f) ninguno trabajable por
      requerir revision -> REQUIERE_REVISION, PROC-REP-125.
      PENDIENTE_RECURSOS y REQUIERE_REVISION nunca vuelven a EN_COLA
      directamente: son dos agregados distintos y no se mezclan entre si
      ni con el estado de workflow EN_REVISION. En los casos (c), (d), (e)
      y (f), si existia una toma/participacion activa, el sistema la
      cierra automaticamente (BR-REP-018): no se pregunta "continuar con
      otro Detalle" porque no queda ninguno trabajable. V1.4: cuando una
      cancelacion nace de la decision del cliente (PROC-REP-047) con la Orden
      TODAVIA SIN HABILITAR (nunca paso por PROC-REP-140), un resultado con
      Detalles trabajables restantes NO la devuelve a la cola
      (PROC-REP-170): continua hacia donde estaba el proceso, a PROC-REP-050
      si el comprobante de recepcion aun no se emitio o a PROC-REP-080 si ya
      se emitio (salidas "Orden sin habilitar"). Los resultados (c) a (f) y la
      prioridad del resolver no cambian.
      V1.4 (iteracion de autorizacion): el RESOLVER y el ENRUTAMIENTO se
      separan (BR-REP-012, BR-REP-034). El resolver devuelve una situacion
      principal mas el conjunto de bloqueos presentes; las aristas de este
      nodo eligen la estacion siguiente segun esa situacion Y los hitos ya
      cumplidos (comprobante emitido, Orden habilitada, toma activa). Salidas
      V1.4 precisadas: "Antes del comprobante de recepcion" (Orden sin
      habilitar y comprobante no emitido) -> PROC-REP-050; "Comprobante
      emitido, factibilidad pendiente" (comprobante emitido y Detalles
      AUTORIZADOS cuya factibilidad aun no se evaluo, con la Orden sin habilitar
      o ya habilitada) -> PROC-REP-080; EN_EJECUCION ("Ejecucion activa
      vigente") -> PROC-REP-190,
      conservando la Ejecucion vigente; PENDIENTE_AUTORIZACION -> PROC-REP-129;
      y TODO_CANCELADO se bifurca por custodia del equipo (BR-REP-033): "Todos
      cancelados, equipo recibido" -> PROC-REP-270 (devolucion fisica) y
      "Todos cancelados, sin equipo bajo custodia" -> fin. Una Orden habilitada con
      Detalles trabajables sigue yendo a la cola (170) o a continuar/liberar
      (212) segun haya o no toma activa. Un Detalle pendiente de autorizacion
      NO es trabajable aunque haya stock, y si no queda ningun Detalle
      trabajable la toma activa se cierra automaticamente tambien en este caso.
      Iteracion 5: cuando ninguno es ejecutable, REQUIERE_REVISION >
      PENDIENTE_AUTORIZACION > PENDIENTE_RECURSOS define solo la situacion
      principal y la espera inicial; el resolver conserva todas las causas
      presentes y se vuelve a evaluar tras cualquier cambio relevante
      (BR-REP-012). Volver aqui desde 080/090 por un Detalle agregado o
      autorizado NO libera ni duplica la toma activa ni toca la prioridad de
      cola: la toma solo se cierra cuando no queda ningun Detalle trabajable.
      Las salidas de cancelacion total son excluyentes y completas
      (BR-REP-033): "equipo bajo custodia" (custodia CONFIRMADA) -> 270;
      "sin equipo bajo custodia" (nunca recibido o ya devuelto) -> fin;
      "custodia sin confirmar" -> PROC-REP-271, sin fin operativo ni
      devolucion automatica hasta resolverla. Desde V1.4 (BR-REP-038), el fin de
      esas salidas pasa antes por PROC-REP-268, la verificacion de saldo a favor
      del cliente, y la devolucion de dinero es independiente de la fisica del
      equipo. Independencia operativa
      (BR-REP-037): si existe al menos un Detalle trabajable, la Orden permite
      su continuidad tecnica aunque otros Detalles esten pendientes de
      autorizacion, de revision o de recursos (ABIERTA_TRABAJABLE o
      EN_EJECUCION con bloqueos individuales conservados); la toma activa solo
      se cierra cuando no queda ningun Detalle trabajable, y el control final
      (PROC-REP-220) solo corresponde cuando todos los Detalles son terminales.
      Iteracion 10 (simplificacion de la decision del cliente): este nodo es
      tambien el ENRUTAMIENTO INTERNO posterior a la decision comercial, para
      que PROC-REP-047 no ofrezca condiciones internas como elecciones del
      cliente. Las tres decisiones vuelven aqui -"Acepta trabajos"
      (PROC-REP-047 -> 211), "Rechaza algunos Detalles" (047 -> 300 -> 211) y
      "Rechaza todos los trabajos" (047 -> 305 -> 211)- y tambien la solicitud
      que sigue sin resolver (PROC-REP-046 -> 211, sin decision registrada), y
      el SISTEMA elige el paso siguiente segun los hitos: sin habilitar y sin
      comprobante -> PROC-REP-050 (que emite el comprobante y sigue a
      PROC-REP-080); con comprobante emitido y Detalles autorizados cuya
      factibilidad aun no se evaluo -> PROC-REP-080, tambien con la Orden YA
      habilitada, de modo que una autorizacion parcial (rechaza algunos) o la
      autorizacion de un Detalle adicional nunca omite su factibilidad
      (BR-REP-034, AUD-V14-003). Esta salida se evalua antes que las salidas por
      estado porque PROC-REP-080 solo CONSULTA disponibilidad -no reserva, no
      interrumpe la Ejecucion vigente ni libera la toma- y vuelve aqui por
      PROC-REP-090 ("Orden ya habilitada") con la factibilidad ya evaluada.
      Con cantidad_detalles = 0 este nodo no se invoca: ninguna arista de una
      Orden sin Detalles llega aqui antes de que el tecnico defina los Detalles
      (BR-REP-013).
    rules:
      - BR-REP-012

  - id: PROC-REP-212
    type: decision
    name: Tecnico desea continuar trabajando esta Orden
    description: >
      Nodo nuevo en V1.3. Solo se alcanza cuando PROC-REP-211 determina
      que existe al menos un Detalle trabajable Y la Orden todavia tiene
      una toma/participacion activa del tecnico actual (PROC-REP-180,
      BR-REP-018). No se libera automaticamente una Orden trabajable solo
      porque termino un Detalle: la decision de continuar con otro
      Detalle o liberar la Orden es una accion explicita del tecnico.
    rules:
      - BR-REP-018

  - id: PROC-REP-213
    type: activity
    name: Liberar Orden de Reparacion
    actor: ACT-TECH
    description: >
      Nodo nuevo en V1.3. El tecnico decide no continuar trabajando la
      Orden (PROC-REP-212 = No): se cierra la participacion/toma activa
      registrada en PROC-REP-180, registrando fecha/hora de fin
      (BR-REP-018). La Orden vuelve a EN_COLA (PROC-REP-170), disponible
      para que el mismo u otro tecnico la tome nuevamente pasando otra vez
      por PROC-REP-172/PROC-REP-180. Nunca se sobrescribe el historial de
      participaciones anteriores.
    outputs:
      - Fecha/hora de fin de participacion
    rules:
      - BR-REP-018

  - id: PROC-REP-220
    type: activity
    name: Realizar control tecnico
    actor: ACT-RECEP
    description: >
      Recepcion realiza la validacion final del funcionamiento de la
      reparacion. Se alcanza cuando todos los Detalles de la Orden son
      terminales (COMPLETO o CANCELADO) y existe al menos uno COMPLETO
      (PROC-REP-211). Recepcion controla la Orden completa pero aprueba o
      rechaza Detalle por Detalle.
    rules:
      - BR-REP-008

  - id: PROC-REP-230
    type: decision
    name: Todos los Detalles fueron aprobados
    description: >
      Si = ningun Detalle fue rechazado en este control. No = al menos un
      Detalle fue rechazado (aunque otros hayan sido aprobados).
      Reformulado respecto de V1.2 ("resultado tecnico correcto") para
      reflejar que el control ahora es granular por Detalle aunque ocurra
      en un unico paso a nivel Orden.

  - id: PROC-REP-235
    type: activity
    name: Identificar Detalle(s) a retrabajar
    actor: ACT-RECEP
    description: >
      Reemplaza a "Registrar control rechazado" de V1.2, que devolvia
      toda la Orden a EN_COLA sin mirar el Detalle. En V1.3 se identifica
      el/los Detalle(s) especificos rechazados, se registra fecha,
      usuario, observacion y resultado del control, y esos Detalles
      vuelven a DEFINIDO (se reabren), conservando el historial de sus
      Ejecuciones anteriores y de este mismo rechazo. El estado de la
      Orden no se fija aqui: se recalcula mediante el resolver
      (PROC-REP-211), que puede devolver la Orden a EN_COLA si algun
      Detalle reabierto es trabajable, o a un estado bloqueado si no.
    outputs:
      - Fecha
      - Usuario
      - Observacion
      - Detalle(s) rechazado(s) y resultado de control
    rules:
      - BR-REP-008

  - id: PROC-REP-245
    type: activity
    name: Calcular puntaje de la reparacion
    actor: ACT-SYSTEM
    description: >
      Cada Detalle aprobado tiene una ponderacion configurable segun su
      Tipo de Reparacion. El puntaje se calcula por Detalle en el momento
      de su aprobacion (no se espera a que el resto de los Detalles de la
      Orden tambien esten aprobados). El puntaje total de la Orden es la
      suma de los puntajes de sus Detalles. Todavia no esta definida la
      distribucion o acreditacion de ese puntaje entre los distintos
      tecnicos que participaron de un mismo Detalle: no debe asumirse que
      se asigna automaticamente a un unico tecnico.
    outputs:
      - Puntaje de la reparacion (por Detalle y total de Orden)
    rules:
      - BR-REP-009

  - id: PROC-REP-240
    type: activity
    name: Marcar reparacion lista
    actor: ACT-SYSTEM
    description: >
      La Orden pasa a REPARACION_LISTA. Requiere control tecnico aprobado
      sobre todos los Detalles (posiblemente tras varios ciclos de
      rechazo/retrabajo, PROC-REP-235): este estado no es deducible
      unicamente mirando los Detalles, depende del evento de aprobacion
      de Recepcion.

  - id: PROC-REP-250
    type: decision
    name: Requiere entrega a cliente
    description: >
      Se alcanza tanto cuando la reparacion quedo lista (PROC-REP-240)
      como cuando la Orden finalizo SIN_REPARACION (PROC-REP-069). Las
      ordenes que requieren entrega/documentacion al cliente son
      CLIENTE_EXTERNO, RT_GARANTIA_VENTA y RMA_GARANTIA_REPARACION.
      RT_INTERNO continua hacia informar el resultado al sistema RT
      (PROC-REP-290) y luego a la entrega/devolucion del equipo a Gestion RT
      (PROC-REP-270).

  - id: PROC-REP-260
    type: activity
    name: Notificar cliente
    actor: ACT-RECEP
    description: >
      El sistema asiste a Recepcion preparando el mensaje de WhatsApp
      para avisar que la reparacion esta lista, o que la Orden concluyo
      SIN_REPARACION segun corresponda; Recepcion confirma y envia. Por
      ahora no se automatiza completamente el envio por WhatsApp; a
      futuro podra integrarse con WhatsApp, chatbot o portal web. Sin
      cambios respecto de V1.2. En V1.3 todo origen con entrega a cliente
      (CLIENTE_EXTERNO, RT_GARANTIA_VENTA, RMA_GARANTIA_REPARACION) sigue
      luego a PROC-REP-265 (validacion de la condicion de entrega): no hay
      un camino alternativo que la evite.

  - id: PROC-REP-280
    type: activity
    name: Generar comprobante final
    actor: ACT-SYSTEM
    description: >
      Reubicado en V1.3: una version anterior de este borrador lo generaba
      antes de completar el cobro (PROC-REP-265), lo que podia dejarlo
      desactualizado si despues se registraba un pago final. Ahora se
      genera recien despues de que PROC-REP-265 aprueba la condicion de
      entrega (Saldo = 0 o cortesia total en una Orden cobrable, o
      condicion NO_COBRABLE por origen), de modo que el saldo mostrado, si
      existe, sea siempre el definitivo al momento de la entrega. Documento final que informa el
      trabajo efectivamente realizado, desglosado por Detalle: Tipo de
      Reparacion, precio snapshot, Detalles cancelados (excluidos del
      Subtotal pero trazables), Ajustes Comerciales aplicados (por ejemplo
      cortesias), Base Comercial, Total Cobrable, todos los Pagos
      registrados, las Devoluciones de dinero realizadas (V1.4, BR-REP-038) y
      el Saldo final (0 en una Orden cobrable, porque la condicion de entrega
      exige Saldo = 0). Si la Orden tuvo reparacion, el
      comprobante incluye ademas las condiciones y vencimiento de la
      garantia de reparacion. Si el resultado de la Orden es
      SIN_REPARACION, no se genera garantia de reparacion y el comprobante
      refleja Subtotal = 0: no existe importe cobrable asociado
      (PROC-REP-069, BR-REP-010).
    outputs:
      - Comprobante final con desglose de Detalles/Ajustes/pagos/saldo
      - Garantia de reparacion (unicamente si hubo reparacion)

  - id: PROC-REP-265
    type: decision
    name: Completar cobro - validar condicion de entrega
    description: >
      V1.4 (saldo a favor, BR-REP-038): tres resultados excluyentes. Saldo = 0
      (incluida una cortesia total sin Pagos recibidos, y las Ordenes
      NO_COBRABLES por origen) -> PROC-REP-280; Saldo > 0
      ("No, saldo pendiente de cobro") -> PROC-REP-266, circuito de cobro; Saldo
      < 0 ("No, saldo a favor del cliente") -> PROC-REP-267, registro de la
      devolucion de dinero. Un saldo a favor NUNCA se resuelve con el circuito de
      cobro ni con un pago de importe negativo, y no permite entregar ni generar
      el comprobante final: recien cuando las devoluciones realizadas llevan el
      Saldo a 0 se aprueba la condicion de entrega. Los pagos originales no se
      modifican. Aplica a la entrega de una reparacion y tambien al cierre
      SIN_REPARACION (PROC-REP-069 -> 250 -> 260 -> 265) y a un cierre con
      Detalles COMPLETO y CANCELADO.
      Nodo nuevo en V1.3. Es el gate general de condicion de entrega de
      todo origen con entrega a cliente, y la fase secuencial de "Completar
      Cobro" (BR-REP-017-B) cuando hay algo por cobrar: determina el Total
      Cobrable definitivo a partir de los Detalles finales y calcula Saldo
      = Total Cobrable - Total Pagado + Total Devuelto (V1.4, BR-REP-038;
      Total Pagado surge de los Pagos ya registrados en cualquier momento
      anterior mediante la capacidad transversal de Pago, BR-REP-017-A, y
      Total Devuelto de las devoluciones de dinero realizadas, PROC-REP-267). Se evalua antes de generar el
      comprobante final (PROC-REP-280) y de entregar el equipo al cliente.
      La condicion de entrega se aprueba segun el origen: CLIENTE_EXTERNO
      aprueba por Saldo = 0 o cortesia total aplicada a la Orden (V1.4: una
      cortesia total con Pagos ya recibidos deja Saldo < 0 y se devuelve en
      PROC-REP-267, no habilita la entrega por si sola);
      RT_GARANTIA_VENTA y RMA_GARANTIA_REPARACION aprueban directamente por
      su condicion comercial NO_COBRABLE (por origen, no por cortesia), sin
      cobro pendiente, sin pagos, sin anticipo ni Saldo mediante pagos, y
      por lo tanto nunca entran en PROC-REP-266. Es el mismo gate para
      todos: no existe un bypass alrededor de este nodo. No existe
      override para entregar con deuda pendiente en V1.3.
      Reubicado respecto de una version anterior de este borrador, que
      generaba el comprobante final antes de este gate: eso podia dejarlo
      desactualizado si despues se registraba un pago final; ahora el
      comprobante (PROC-REP-280) se genera recien cuando esta validacion
      aprueba, reflejando siempre el saldo definitivo.
    rules:
      - BR-REP-017

  - id: PROC-REP-266
    type: activity
    name: Orden con saldo pendiente (entrega bloqueada)
    actor: ACT-SYSTEM
    description: >
      La Orden (cobrable) no puede entregarse mientras exista saldo
      pendiente y no se trate de cortesia total; las Ordenes NO_COBRABLES
      por origen aprueban la condicion de entrega en PROC-REP-265 y nunca
      llegan aqui. La entrega
      queda bloqueada hasta que se registre uno o mas Pagos adicionales
      -mediante la misma capacidad transversal de Pago usada durante toda
      la vida de la Orden, no un mecanismo aparte- que salden la
      diferencia (o se aplique una cortesia); despues de cada Pago se
      revalida la condicion de entrega, recalculando el Saldo
      (PROC-REP-265). V1.4: este nodo atiende SOLO el Saldo > 0; un saldo a
      favor del cliente (Saldo < 0) va a PROC-REP-267 y nunca entra aqui.
    rules:
      - BR-REP-017

  - id: PROC-REP-271
    type: activity
    name: Resolver custodia del equipo pendiente de confirmar
    actor: ACT-RECEP
    description: >
      Nodo nuevo en V1.4 (FEAT-REP-009), unica espera de regularizacion de la
      custodia. Se alcanza desde PROC-REP-211 ("Todos cancelados, custodia sin
      confirmar") o PROC-REP-306 ("Custodia sin confirmar") cuando la Orden fue
      cancelada pero el comprobante de recepcion fue generado sin confirmarse
      ni descartarse el intercambio fisico (BR-REP-033). La Orden permanece
      CANCELADA y NO finaliza operativamente hasta resolver la custodia; el
      equipo NO se envia automaticamente a devolucion. Recepcion determina
      que ocurrio y lo registra con usuario, fecha/hora y evidencia o
      referencia (por ejemplo, el comprobante). Resultados: equipo recibido y
      aun bajo custodia -> PROC-REP-270 (devolucion obligatoria); equipo nunca
      recibido, o recibido y ya devuelto -> fin, sin duplicar la devolucion (el
      fin pasa antes por PROC-REP-268, la verificacion de saldo a favor del
      cliente).
      Aplica solo a CLIENTE_EXTERNO; la custodia de los demas origenes sigue sin
      definir. No cambia CANCELADA a ENTREGADA.
    inputs:
      - Orden CANCELADA con recepcion fisica sin confirmar
    outputs:
      - Situacion de custodia determinada (usuario, fecha/hora y evidencia o referencia)
    rules:
      - BR-REP-033

  - id: PROC-REP-267
    type: activity
    name: Registrar devolucion de dinero al cliente
    actor: ACT-RECEP
    description: >
      Nodo nuevo en V1.4 (FEAT-REP-007, BR-REP-038). Se alcanza cuando la
      Orden tiene saldo a favor del cliente (Saldo < 0, con Saldo = Total final
      de la OR - Pagos recibidos + Devoluciones realizadas): desde PROC-REP-265
      ("No, saldo a favor del cliente") antes de poder aprobar la entrega, o
      desde PROC-REP-268 ("Saldo a favor del cliente pendiente de devolver")
      antes de que la Orden finalice operativamente. Recepcion registra una
      DEVOLUCION de dinero REALIZADA: un movimiento financiero distinto del
      pago (no es un pago de importe negativo y no modifica ni borra los pagos
      originales) con identificador unico, Orden, importe positivo devuelto,
      medio de devolucion, usuario responsable, fecha/hora, referencia de la
      operacion y motivo. Solo una devolucion efectivamente realizada modifica
      el Saldo; una intencion o solicitud pendiente no. El importe no puede
      superar el saldo a favor pendiente (sin una regla adicional aprobada) y
      una misma referencia de operacion no se computa dos veces aunque se
      reingrese al circuito. Devolucion parcial: el saldo a favor remanente
      sigue pendiente y la Orden vuelve a la validacion; devolucion total:
      Saldo = 0. Cada pasada por este nodo exige un movimiento real, de modo
      que no hay revalidaciones sin accion financiera. Es independiente de la
      devolucion FISICA del equipo (PROC-REP-270, custodia, BR-REP-033): el
      dinero y el equipo son dimensiones distintas. Quien esta autorizado a
      registrar devoluciones y el catalogo de medios quedan pendientes de
      definicion por negocio. Salidas excluyentes segun desde donde se llego:
      "Devolucion registrada, validar entrega" -> PROC-REP-265 y "Devolucion
      registrada, validar fin de Orden" -> PROC-REP-268.
    inputs:
      - Orden con saldo a favor del cliente pendiente de devolver
    outputs:
      - Devolucion de dinero realizada (identificador, Orden, importe positivo, medio, usuario, fecha/hora, referencia y motivo)
      - Saldo recalculado sin modificar los pagos originales
    rules:
      - BR-REP-038
      - BR-REP-017

  - id: PROC-REP-268
    type: decision
    name: Hay saldo a favor del cliente pendiente de devolver
    description: >
      Nodo nuevo en V1.4 (FEAT-REP-008, BR-REP-038). Ultima verificacion
      financiera antes de EVT-REP-999: ninguna Orden finaliza operativamente con
      dinero a favor del cliente sin devolver. Es la unica entrada al fin del
      flujo, por lo que lo atraviesan la entrega comercial y la devolucion a
      Gestion RT (PROC-REP-270), el cierre SIN_REPARACION (que ya paso por
      PROC-REP-265) y todas las cancelaciones y desistimientos (PROC-REP-211,
      306 y 271 cuando no hay devolucion fisica pendiente, y PROC-REP-270 tras la
      devolucion fisica del equipo). "Sin saldo a favor pendiente" ->
      EVT-REP-999; "Saldo a favor del cliente pendiente de devolver" ->
      PROC-REP-267, que vuelve aqui tras cada devolucion registrada. En una
      Orden entregada normalmente el Saldo ya quedo en 0 en PROC-REP-265, por lo
      que la verificacion es trivial. Para los origenes sin circuito comercial
      (RT_INTERNO, RMA_GARANTIA_REPARACION, RT_GARANTIA_VENTA) no existen Pagos
      ni Saldo mediante pagos: la respuesta es siempre "sin saldo a favor" y no
      se registra ningun movimiento; un saldo a favor en esos origenes no esta
      definido y queda como pendiente funcional. La devolucion de dinero es
      independiente de la devolucion fisica del equipo y de la custodia
      (PROC-REP-270/271).
    rules:
      - BR-REP-038
      - BR-REP-033

  - id: PROC-REP-270
    type: activity
    name: Entregar equipo
    actor: ACT-ADMIN
    description: >
      Entrega del equipo. Para origenes con entrega a cliente
      (CLIENTE_EXTERNO, RT_GARANTIA_VENTA, RMA_GARANTIA_REPARACION) se
      entrega al cliente junto con el comprobante final (PROC-REP-280),
      una vez aprobada la condicion de entrega
      (PROC-REP-265: Saldo = 0 o cortesia total, o NO_COBRABLE por origen); la Orden pasa a ENTREGADA. Para RT_INTERNO (alcanzado
      desde PROC-REP-290, despues de informar el resultado a Gestion RT) es
      la entrega/devolucion del equipo a Gestion RT: no es una entrega
      comercial, no pasa por PROC-REP-265/266/280, no depende de Saldo ni de
      Pagos, y NO define el estado terminal de la Orden RT_INTERNO, que sigue
      pendiente de decision funcional (no se asume ENTREGADA ni ningun
      estado nuevo). Tercer contexto (V1.4, desistimiento del cliente): tras
      PROC-REP-306 -Orden CANCELADA antes de definir Detalles- registra la
      DEVOLUCION fisica del equipo al cliente. No es una entrega comercial:
      no pasa por PROC-REP-250/260/265/266/280, no genera comprobante
      final ni garantia, no depende de Saldo ni de Pagos, y NO pasa la Orden
      a ENTREGADA (permanece CANCELADA). Cuarto contexto (V1.4): tras la
      cancelacion de una Orden CON Detalles cuyos Detalles quedan todos
      CANCELADO (PROC-REP-211, "Todos cancelados, equipo bajo custodia"): la
      devolucion fisica es OBLIGATORIA si el equipo esta bajo custodia (tambien
      tras resolverse PROC-REP-271); no se registra una segunda devolucion de
      un equipo ya devuelto. Se entiende por bajo custodia el equipo recibido (recepcion
      fisica confirmada: comprobante entregado a cambio del equipo, BR-REP-033) y la Orden CANCELADA no finaliza
      operativamente sin ella. Registra fecha/hora, usuario que entrega y
      persona que recibe; no pasa por control tecnico, cobro ni entrega
      comercial y no convierte CANCELADA en ENTREGADA. Si el equipo nunca fue
      recibido, 211 finaliza directamente y no se pasa por aqui. Una Orden con
      algun Detalle COMPLETO no entra por este camino: sigue control tecnico,
      cierre comercial y entrega. V1.4 (BR-REP-038): la devolucion FISICA del
      equipo y la devolucion de DINERO son dimensiones independientes; tras este
      nodo el fin del flujo pasa siempre por PROC-REP-268 (verificacion de saldo
      a favor), y la entrega comercial solo se habilita cuando PROC-REP-265
      aprueba con Saldo = 0.
    outputs:
      - Devolucion fisica registrada (fecha/hora, usuario que entrega y persona que recibe) cuando corresponde
    rules:
      - BR-REP-033
      - BR-REP-038

  - id: PROC-REP-290
    type: activity
    name: Informar resultado al sistema RT
    actor: ACT-SYSTEM
    description: >
      Para equipos de Rosario Tecno, el resultado de la Orden (incluida
      la reparacion realizada o, si corresponde, SIN_REPARACION) debera
      poder informarse a futuro al sistema que gestiona stock y ventas.
      RT_INTERNO es NO_COBRABLE_AL_CLIENTE: no pasa por la validacion de
      saldo de PROC-REP-265. Para RT_INTERNO este nodo se ejecuta ANTES de
      la entrega/devolucion del equipo a Gestion RT (PROC-REP-270): primero
      se informa el resultado, despues se registra la devolucion. El estado
      terminal definitivo para RT_INTERNO queda pendiente de definicion.

  - id: PROC-REP-300
    type: activity
    name: Cancelar Detalle
    description: >
      Un Detalle no terminal (DEFINIDO, sin Ejecucion activa) puede
      pasar a CANCELADO en cualquier momento en que la Orden este
      disponible, conservando su Tipo, precio snapshot y todo su
      historial previo. Si el Detalle estuviera EN_PROGRESO, primero debe
      interrumpirse su Ejecucion (PROC-REP-200, resultado "Interrumpido"),
      que lo devuelve a DEFINIDO, antes de poder cancelarlo -esa
      interrupcion ya paso por PROC-REP-210, que reconcilio sus insumos
      (CONSUMIDO/LIBERADO/DESPERDICIO), por lo que el Detalle nunca llega
      a CANCELADO con reservas activas (BR-REP-014)-. QUIEN esta
      autorizado a cancelar un Detalle todavia no fue definido por
      negocio: se omite deliberadamente el campo `actor` de este nodo (el
      schema no lo exige) en vez de asumir uno sin aprobacion -ver
      docs/discovery/README.md, seccion Pendientes de V1.3-. Simplificacion
      de este diagrama: se representa como alcanzable desde PROC-REP-170
      (el punto de espera mas representativo de la Orden), aunque
      conceptualmente puede originarse en cualquier momento sin Ejecucion
      activa sobre ese Detalle. V1.4: tambien se alcanza desde la decision
      del cliente (PROC-REP-047, "Rechaza algunos Detalles"), una vez por
      Detalle rechazado, con las mismas precondiciones; antes de habilitar la
      Orden no hay Ejecuciones ni reservas, por lo que no hay nada que
      reconciliar. V1.4: tambien se alcanza desde la evaluacion
      tecnica (PROC-REP-183, DESCARTADO), de inmediato tras registrar el
      resultado, con motivo tecnico DIAGNOSTICO_DESCARTADO, diferenciado del
      rechazo o desistimiento del cliente; el Detalle nunca tuvo Ejecucion ni
      reserva y no se cancelan los demas Detalles ni la Orden. Salidas
      excluyentes segun el contexto: "Descarte durante la evaluacion tecnica" ->
      PROC-REP-184 (antes de invocar el resolver, para registrar las
      reparaciones adicionales que el tecnico haya detectado y que la Orden no
      finalice prematuramente) y "Cancelacion fuera de la evaluacion tecnica" ->
      PROC-REP-211 (rechazo del cliente o cancelacion desde la cola), donde el
      resolver determina el desenlace, incluido el circuito de custodia si
      todos los Detalles quedan CANCELADO (BR-REP-036).
    rules:
      - BR-REP-014
      - BR-REP-030
      - BR-REP-036

  - id: PROC-REP-305
    type: activity
    name: Cancelar Orden / trabajos pendientes
    description: >
      Cancela los Detalles NO TERMINALES de la Orden (DEFINIDO ->
      CANCELADO); los Detalles ya COMPLETO permanecen COMPLETO, nunca se
      reescribe trabajo efectivamente realizado. No puede ejecutarse
      mientras exista una Ejecucion activa: primero debe cerrarse/
      interrumpirse (PROC-REP-200), reconciliando en ese paso los insumos
      del Detalle interrumpido (PROC-REP-210: CONSUMIDO/LIBERADO/
      DESPERDICIO), de modo que ningun Detalle termine CANCELADO
      conservando reservas activas (BR-REP-014). A diferencia de una
      version anterior
      de este borrador, esta accion NO fija la Orden en CANCELADA de
      forma directa: a continuacion se invoca el resolver de estado de
      Orden (PROC-REP-211), y es su resultado el que determina el
      desenlace -CANCELADA si, tras la cascada, todos los Detalles quedan
      CANCELADO; o continuacion normal del flujo (Control Tecnico ->
      REPARACION_LISTA -> cierre comercial -> entrega) si queda al menos
      un Detalle COMPLETO, porque ese trabajo efectivamente realizado
      debe poder controlarse, cobrarse y cerrarse-. Se preservan
      Ejecuciones, tecnicos, estaciones, tiempos, insumos, movimientos,
      precios, pagos y auditoria. Las consecuencias comerciales (por
      ejemplo, reembolso de pagos ya realizados si la Orden termina
      CANCELADA) quedan explicitamente pendientes, fuera de V1.3. QUIEN
      esta autorizado a ejecutar esta accion todavia no fue definido por
      negocio: se omite deliberadamente el campo `actor` de este nodo (el
      schema no lo exige) en vez de asumir uno sin aprobacion -ver
      docs/discovery/README.md, seccion Pendientes de V1.3-. V1.4: tambien se
      alcanza desde la decision del cliente (PROC-REP-047, "Rechaza todos los
      trabajos"): es la operacion que respalda la opcion de UI
      "Desistir de todos los trabajos pendientes", que aplica a cada Detalle
      las mismas reglas que la cancelacion individual; los Detalles COMPLETO
      permanecen COMPLETO.
    rules:
      - BR-REP-014
      - BR-REP-030

  - id: PROC-REP-306
    type: activity
    name: Cancelar Orden por desistimiento del cliente (sin Detalles)
    description: >
      Nodo nuevo en V1.4 de FEAT-REP-009. Cancela anticipadamente una Orden
      sin Detalles (REQUERIMIENTO o EN_REVISION, cantidad_detalles = 0)
      cuando el cliente desiste (PROC-REP-056, "Desiste sin Detalles": no continua
      con la revision tecnica; es el desistimiento propio de esa etapa, separado
      de la autorizacion por Detalle de PROC-REP-046/047). Es una transicion
      EXPLICITA a CANCELADA:
      no crea Detalles ficticios, no ejecuta la cascada de PROC-REP-305 sobre
      una coleccion vacia y no invoca el resolver de PROC-REP-211 para
      inferir CANCELADA con cantidad_detalles = 0 (BR-REP-013). Registra
      motivo de desistimiento (obligatorio), observaciones (opcionales),
      usuario responsable y fecha/hora. No registra reparacion, puntaje
      tecnico ni consumo de insumos y preserva el historial de Cliente,
      Equipo y Orden. Es una CANCELACION del proceso, distinta de
      SIN_REPARACION (PROC-REP-069). Siguiente paso segun la custodia
      (BR-REP-033): el equipo esta recibido solo si la recepcion fisica fue
      CONFIRMADA (comprobante entregado a cambio del equipo, no simplemente
      generado; una confirmacion pendiente no se lee en silencio como recibido
      ni como no recibido, BR-REP-033: se deriva a PROC-REP-271); si esta confirmada
      su devolucion fisica se
      registra en PROC-REP-270, y si no fue recibido (por ejemplo, el cliente
      desiste antes del comprobante) el proceso continua a PROC-REP-268 y finaliza sin
      devolucion fisica. Antes del fin se verifica el saldo a favor por una sena
      ya pagada (BR-REP-038). Las reglas de cancelacion de Ordenes
      con Detalles (PROC-REP-300/305, BR-REP-014) no se alteran. QUIEN esta
      autorizado a cancelar sigue sin definirse por negocio: se omite
      deliberadamente el campo actor, igual que en PROC-REP-300/305.
    inputs:
      - Orden en REQUERIMIENTO con cantidad_detalles = 0
      - Decision de desistimiento del cliente
    outputs:
      - Orden CANCELADA
      - Motivo de desistimiento (obligatorio)
      - Observaciones (opcionales)
      - Usuario responsable y fecha/hora
    rules:
      - BR-REP-013
      - BR-REP-027
      - BR-REP-033

  - id: EVT-REP-003
    type: event
    name: Hay una solicitud de autorizacion de un Detalle pendiente de gestion
    description: >
      Evento de inicio de la gestion INDEPENDIENTE de Recepcion (V1.4), analogo
      a EVT-REP-002 como entrada propia. Se dispara cuando existe al menos un
      Detalle PENDIENTE_AUTORIZACION cuya solicitud (creada, por ejemplo, por un
      tecnico en PROC-REP-128) todavia no fue resuelta. Recepcion puede
      gestionarla en cualquier momento, incluso mientras un tecnico ejecuta
      otro Detalle, sin que el tecnico deba esperarla: la creacion de la
      solicitud (PROC-REP-128) y su resolucion efectiva (PROC-REP-046/047) son
      actividades separadas (BR-REP-037). Converge en PROC-REP-046.

  - id: EVT-REP-999
    type: end
    name: Fin del flujo de Orden de Reparacion
    description: >
      Punto de fin comun a la entrega (PROC-REP-270, tanto a cliente como
      la devolucion a Gestion RT de RT_INTERNO, que llega alli despues de
      PROC-REP-290), y a la Orden CANCELADA que resulta del
      resolver (PROC-REP-211) cuando, tras cancelar un Detalle
      (PROC-REP-300) o cancelar los Detalles no terminales de la Orden
      (PROC-REP-305), todos los Detalles quedan CANCELADO sin ningun
      COMPLETO. Una cancelacion que deja al menos un Detalle COMPLETO no
      llega aqui: continua el flujo normal hacia Control Tecnico
      (PROC-REP-211 -> PROC-REP-220).


