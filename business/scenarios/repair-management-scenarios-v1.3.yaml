      exitosa, ejecucion completada, control aprobado y pago final
      realizado al retirar antes de la entrega. Representa el
      comportamiento normal del proceso, no necesariamente el camino con
      menos nodos: en particular, es normal que el cliente tenga Saldo
      pendiente hasta el momento de retirar el equipo.

